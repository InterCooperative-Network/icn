[docs."docs/design/governance-broad-fallback-observability.md"]
category = "design"
status = "draft"
title = "Governance Broad-Fallback Observability and Retirement Evidence"
description = "Design/control map for #2341: after #2340 every known governance mutation surface is class-first with governance:write retained as an accepted-also compatibility fallback, but the repo has no bounded, privacy-safe way to measure which accepted candidate scope callers actually present. Inventories the post-#2340 class-first surface from live main — 51 governance HTTP mutation handlers (charter 6, proposal 8, federation 7 via extract_federation_common, steward 1, comment 5, meeting 12, activity 8, process 4), three gateway aliases (cast_vote_alias, decision-registry create_meeting, index_decision_endpoint), and the governance JSON-RPC mappings (corrects the informal five-method count to seven by including the two #2113 delegation writes) — and confirms no broad-only or narrow-only-without-fallback handlers remain. Specifies a matched-scope outcome model (class/fallback/class_preferred/rejected_sibling/rejected_unrelated/rejected_missing), a bounded signal schema over closed enums (surface_kind/route_family/required_class/match_outcome/observation_outcome), an explicit privacy budget prohibiting token contents, DIDs, entity/actor/subject/domain/resource/proposal/meeting/activity/program/milestone/receipt IDs, payloads, deliberation content, IPs, user agents, free-form labels/errors, and any high-cardinality value, and an absolute observe-only guarantee (observation failure never changes any authorization, handler, route, receipt, mandate, membership, manager, or persistence outcome). Defines the test matrix and the retirement criteria a separate later proposal would need — measured compatibility across every surface, a defined observation window, candidate (unapproved) thresholds, trusted issuance (#2080), entity-aware subject/target authorization (#2061), and a separate enforcement issue/PR with rollback. States explicitly that #2341 does not authorize fallback removal. Docs only: no runtime, observability, scope, handler, route, receipt, token, enforcement, mandate, entity-auth, vault, encryption, provider-import, NYCN, icn-learn, icn-infra, UI, fixture, or readiness/completion change."
last_updated = "2026-07-06"
owner = "matt"
audiences = ["architects", "developers", "security", "operators"]
depends_on = ["docs/design/governance-write-authority-decomposition.md", "docs/design/governance/governance-write-decomposition.md", "docs/design/governance/mandate-gate-design.md", "docs/design/entity-aware-auth-control-map.md", "docs/architecture/ABUSE_CASE_HARDENING_STRATEGY.md", "docs/rfcs/RFC-0018-entity-aware-request-authorization.md"]

[docs."docs/design/mutation-applied-receipt-decision-rung.md"]
category = "design"
status = "draft"
title = "MutationAppliedReceipt decision rung — A1/A2/A3/A4"
description = "Narrow decision document resolving the four implementation blockers named in the merged #2307 MutationAppliedReceipt design/audit contract (#2308, under #1748/#2141), mirroring the mutation-plan-recorded-receipt-decision-rung.md cadence — decide hash-participating structure in writing before the icn:gov:mutation_applied:v1 tag is pinned. A1 (plan→application reference): the receipt carries both the caller-opaque plan_id and the content-addressed plan_record_hash of the MutationPlanRecordedReceipt it applies — the lane's third inter-receipt link — verified fail-closed (get_mutation_plan_recorded then record_hash compare; the referenced plan must exist in-session with a matching plan_id), with activation + decision + gate basis inherited transitively through the plan→activation chain rather than re-referenced in v1. A2 (result representation): result_hash-only v1 (a caller-supplied 32-byte fingerprint of the application-result record, distinct in name from the plan's body_hash; the applied-result body — operation list, target list, effect payload, or any typed operation/result/effect model — is never stored, preserving the meaning firewall and privacy), no application-kind taxonomy. A3 (timestamp): a single caller-supplied applied_at, hashed but excluded from stable duplicate identity, byte-parallel with the six landed classes' recorded_at; no distinct executed_at/effective_at; no wall-clock in cross-node identity. A4 (applied-witness boundary): applied means an application fact was recorded, not executed/authorized/validated/enforced/rolled-back/proven-correct; applied_by is recorder/apply-witness evidence granting zero authority; a caller-supplied result_hash is sufficient for v1; verifiable-effect binding, rollback semantics, typed result models, and evidence-packet production are deferred. Pins a consolidated candidate :v1 field layout (domain_id, session_id, application_id, plan_id, plan_record_hash, applied_by, result_hash, applied_at, record_hash), preconditions, and the implementation PR's validation matrix. Design only — no Rust/UI/schema/OpenAPI/SDK/receipt-class change; no member-shell change; no human/AT execution (Refs #2308, #2306, #2307, #2305, #2303, #1748, #2141, #2041; no closure claims)"
last_updated = "2026-07-04"
owner = "matt"
audiences = ["architects", "developers"]

[docs."docs/design/mutation-applied-receipt.md"]
category = "design"
status = "draft"
title = "MutationAppliedReceipt — Design/Audit Contract"
description = "Design/audit contract for #2306 (under #1748/#2141): the candidate seventh ProcessTransitionReceipt rung, a MutationAppliedReceipt witnessing that a previously recorded mutation plan (MutationPlanRecordedReceipt, landed #2303) was applied, recorded after the plan. Audits current state honestly (MutationAppliedReceipt has no Rust seam — framing/docs only; the six landed classes ProcessSessionOpened/DeliberationEntryRecorded/DecisionRecorded/ProcessGateResult/ActivationCrossed/MutationPlanRecorded are the only runtime ProcessTransitionReceipts; icn-baseline-lock's EvidencePacket is a separate baseline-lock bundle, not this class). Proposes a candidate icn:gov:mutation_applied:v1 contract subject to implementation proof (session-anchored (domain_id, session_id), caller-opaque application_id, plan reference by plan_id + content-addressed plan_record_hash as the lane's third inter-receipt link verified fail-closed via get_mutation_plan_recorded, recorder-not-applier DID granting zero authority, result_hash-only fingerprint with the applied-result body never stored, applied_at hashed but excluded from identity, put_opaque_if_absent idempotence with fail-closed conflict and session precondition), places it at ADR-0026 Layer 2 self-hashed (blake3 record_hash, no signature/merkle — naming the layering caveat), preserves the meaning-firewall + privacy boundary (no kernel-readable operation/result model, no applied-result body text), defers member-shell rendering, and names blockers for a narrow decision rung before implementation: A1 plan→application reference posture, A2 application body/result representation, A3 applied_at timestamp semantics, A4 the applied-witness boundary vs execution/authority boundary. States runtime implementation cannot begin while any hash-participating blocker (A1/A2/A4) is unresolved. Recommendation Option C: land this contract, then a decision rung, then implementation. Explicitly stops at application-recorded — the receipt never executes, validates, authorizes, or rolls back a mutation; EvidencePacketProducedReceipt, action-card triggers, and any typed/kernel-readable result model are deferred. Design only — no Rust/UI/schema/OpenAPI/SDK/receipt-class change; no member-shell change; no human/AT execution (Refs #2306, #2305, #2303, #2302, #2300, #1748, #2141, #2041; no closure claims)"
last_updated = "2026-07-04"
