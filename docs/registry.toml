# ICN Documentation Registry
# Machine-readable source of truth for all documentation
# Categories: architecture, design, strategy, guide, reference, operations, security, archive
# Statuses: canonical, living, draft, archived, superseded, missing
#
# Control plane: [control] + [[doc_path_defaults]] supply defaults; [docs."path"] overlays.
# Human summary: DOCUMENT_REGISTRY.md (regenerate via doc_control_check.py).
# Enforcement ladder (CI vs --strict vs warn-only): docs/DOCUMENTATION_MAINTENANCE.md § Documentation control plane.

[control]
schema_version = 1
allowlisted_docs_subdirs = [
  "adr", "ai", "api", "architecture", "archive", "ci", "contracts", "crate-manifests", "demo", "deployment",
  "design", "design-language", "dev", "development", "examples", "features", "guides", "handoffs", "internal",
  "maintenance", "manual", "migration-guides", "mobile", "observability", "onboarding", "operations",
  "ops", "performance", "phases", "pilots", "planning", "plans", "reference", "rfcs", "scripts", "sdis",
  "security", "spec", "sprints", "state", "status", "strategy", "summit", "superpowers",
  "templates", "testing", "vision",
]
canonical_doc_paths = [
  "docs/INDEX.md",
  "docs/STATE.md",
  "docs/ARCHITECTURE.md",
  "docs/DOCUMENTATION_CONTROL_SYSTEM.md",
]
required_header_keys = ["Status", "Canonical", "Last Reviewed"]

# Enforcement: warnings by default; use `doc_control_check.py --strict` to fail CI-style.
[control.enforcement]
stale_canonical_warning_days = 90
warn_duplicate_h1_across_dirs = true
fail_duplicate_h1_across_dirs = false
warn_stale_canonical = true
fail_stale_canonical = false
warn_superseded_outside_archive = true
fail_superseded_outside_archive = false
warn_missing_explicit_registry = true
fail_missing_explicit_registry = false
# Registry rows pointing at missing files; broken superseded_by targets; YAML vs merged drift (non–control-plane docs).
warn_orphan_registry_entry = true
fail_orphan_registry_entry = false
warn_broken_superseded_by = true
fail_broken_superseded_by = false
warn_yaml_registry_mismatch = true
fail_yaml_registry_mismatch = false
explicit_registry_warn_prefixes = [
  "docs/plans/",
  "docs/planning/",
  "docs/onboarding/",
]

# Longest matching prefix wins (see docs/scripts/doc_control_check.py).

[[doc_path_defaults]]
prefix = "docs/internal/documentation-control-system/"
truth_class = "normative"
role = "internal"
canonical = "no"
freshness = "current"
domain_tags = ["documentation-control"]
recommended_action = "keep"
last_reviewed = "2026-03-26"

