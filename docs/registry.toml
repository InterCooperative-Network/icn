[docs."docs/design/evidence-packet-produced-receipt-decision-rung.md"]
category = "design"
status = "draft"
title = "EvidencePacketProducedReceipt decision rung — EP1/EP2/EP3/EP4/EP5"
description = "Narrow decision document resolving the five implementation blockers the merged #2314 EvidencePacketProducedReceipt design/audit contract named in its §14 (#2315, under #1748/#2141), mirroring the mutation-applied-receipt-decision-rung.md cadence — decide hash-participating structure in writing before the icn:gov:evidence_packet_produced:v1 tag is pinned. Heavier than prior rungs because two pinned fields (receipt_set_hash, redaction_profile_hash) have no precedent anywhere in the repo. EP1 (predecessor linkage): v1 carries all three — caller-opaque mutation_application_id, content-addressed mutation_applied_record_hash (the immediate prior boundary, verified fail-closed via get_mutation_applied then record_hash compare, the lane's fourth inter-receipt link), and receipt_set_hash (the lane's first set commitment); the source set is limited to in-session process/evidence receipt references (record_hashes, never bodies), must include the immediate predecessor, is canonically ordered by receipt-ladder position then record_hash bytewise ascending (canonicalized before hashing so caller input order cannot fork identity), export/delivery artifacts excluded from v1; immediate-predecessor verification is the mandatory fail-closed floor, full set-member verification the recommended default. EP2 (packet-hash coverage): packet_hash covers the public/redacted packet artifact only (body never stored), receipt_set_hash covers ordered source references, neither covers private bodies; packet_hash proves neither correctness/completeness/legal-sufficiency nor delivery/acceptance/audit/human-AT/readiness. EP3 (redaction boundary): redaction_profile_hash-only in v1 (no redaction_profile_id — no repo precedent for id-plus-hash; profile body never stored), proving neither completeness nor legal sufficiency nor human/AT completion. EP4 (meaning of produced): produced = an evidence packet artifact was recorded/produced and content-addressed; the receipt is distinct from export/delivery/acceptance/external-audit/action-card triggering and never delivers/certifies/audits; full non-claims pinned. EP5 (human/AT status): excluded from v1 entirely — no human/AT field, no implied pass, automated a11y/production does not complete #2041, which stays open (referenced only as an open dependency). Pins the consolidated candidate v1 field layout (domain_id, session_id, packet_id, mutation_application_id, mutation_applied_record_hash, receipt_set_hash, packet_hash, redaction_profile_hash, produced_by, produced_at, record_hash), record-hash inputs, stable duplicate identity (produced_at + record_hash excluded), node-stamped produced_at semantics, evidence_packet_produced_conflict sentinel, preconditions, and the implementation PR's validation matrix (including a canonical-set-hash order-independence test). Design only — no Rust/UI/schema/OpenAPI/SDK/receipt-class change; no member-shell change; no fixture change; no human/AT execution (Refs #2315, #2314, #2313, #2312, #2310, #1748, #2141, #2041; no closure claims)"
