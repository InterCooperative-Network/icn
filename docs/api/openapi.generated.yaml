      properties:
        credit_policy:
          type:
          - string
          - 'null'
        currency:
          type:
          - string
          - 'null'
        governance_model:
          type:
          - string
          - 'null'
    UpdateStatusRequest:
      type: object
      description: Update steward status request
      required:
      - status
      properties:
        evidence:
          type: array
          items:
            type: string
        reason:
          type:
          - string
          - 'null'
        status:
          type: string
    VerifyRequest:
      type: object
      description: Verify signed challenge and get capability token
      required:
      - did
      - signature
      - coop_id
      - scopes
      properties:
        coop_id:
          type: string
        did:
          type: string
        scopes:
          type: array
          items:
            type: string
        signature:
          type: string
    VoteChoiceResponse:
      type: string
      description: Vote choice response (simpler for API consumers)
      enum:
      - for
      - against
      - abstain
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
