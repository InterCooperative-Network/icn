        policy_ref:
          type:
          - string
          - 'null'
        reason:
          type: string
    RoleRequest:
      type: object
      description: Role request
      required:
      - holder_id
      - jurisdiction_id
      - role
      properties:
        holder_id:
          type: string
        jurisdiction_id:
