          type: string
    SessionStatusResponse:
      type: object
      description: Session status check response (polling endpoint)
      required:
      - session_id
      - status
      - expires_at
      properties:
        did:
          type:
          - string
          - 'null'
          description: DID that approved the session (only present when status is "approved")
        expires_at:
          type: integer
          format: int64
          minimum: 0
        scopes:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Scopes granted (only present when status is "approved")
        session_id:
          type: string
        status:
          type: string
        token:
          type:
          - string
          - 'null'
          description: Token for the web session (only present when status is "approved")
        token_expires_in:
          type:
          - integer
          - 'null'
          format: int64
          description: Token expiry in seconds (only present when status is "approved")
          minimum: 0
    SignCharterRequest:
      type: object
      description: Sign charter request
      required:
      - signature
      properties:
        role:
          type:
          - string
          - 'null'
        signature:
          type: string
    StandingDomainMembership:
      type: object
      description: One governance-domain membership row in [`StandingResponse`].
      required:
      - domain_id
      - domain_name
      - membership_source
      - status
      properties:
        domain_id:
          type: string
        domain_name:
          type: string
        membership_source:
          type: string
          description: '`"static_list"` or `"trust_threshold"`.'
        status:
          type: string
          description: |-
            `"member"` if the caller is in the static member list,
            `"unverified"` if membership comes from a trust-threshold source that
            this read model does not evaluate (the caller may still be a member;
            the trust graph is the source of truth).
    StandingResponse:
      type: object
      description: |-
        Caller-facing membership and authority read model.

        Returned by `GET /v1/gov/me/standing`. Composes existing governance state
        (domain memberships + structure role assignments) into one digestible
        response so member-facing UI does not need to query four endpoints and
        stitch them together.

        ## What this is NOT

        - This is **not** an authorization token. Scopes here are descriptive,
          not bearer-issued. Authorization decisions still flow through the
          `PolicyOracle`.
        - This is **not** an action-card feed. Action-card generation builds on
          top of this read model in a separate endpoint.
      required:
      - did
      - domains
      - roles
      - authority_scopes
      - generated_at
      properties:
        authority_scopes:
          type: array
          items:
            type: string
          description: |-
            Union of `authority_scope` strings across `roles`, deduplicated and
            sorted. Convenience field for UI; equivalent to flattening `roles`.
        did:
          type: string
          description: The authenticated caller's DID.
        display_label:
          type:
          - string
          - 'null'
          description: |-
            Optional human-readable label. Reserved for a future identity-registry
            lookup; always `None` in this version.
        domains:
          type: array
          items:
            $ref: '#/components/schemas/StandingDomainMembership'
          description: |-
            Governance domains in which this caller has membership standing.
            May be empty.
        generated_at:
          type: integer
          format: int64
          description: |-
            Unix epoch seconds when this standing was computed. The response is a
            snapshot; nothing is cached server-side.
          minimum: 0
        roles:
          type: array
          items:
            $ref: '#/components/schemas/StandingRoleAssignment'
          description: |-
            Role assignments held by this caller across all structures.
            May be empty.
    StandingRoleAssignment:
      type: object
      description: |-
        One role-assignment row in [`StandingResponse`]. Joins the underlying
        [`icn_governance::RoleAssignment`] with cheap structure metadata
        (name + parent entity) so UI does not have to fetch the structure.
      required:
      - role_assignment_id
      - structure_id
      - role
      - authority_scope
      - start_date
      properties:
        authority_scope:
          type: array
          items:
            type: string
        end_date:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        parent_entity_id:
          type:
          - string
          - 'null'
        role:
          type: string
        role_assignment_id:
          type: string
        start_date:
          type: integer
          format: int64
          minimum: 0
        structure_id:
          type: string
        structure_name:
          type:
          - string
          - 'null'
          description: |-
            `None` if the structure was deleted or is otherwise unreadable; the
            role row is still surfaced so the caller can see something is off.
    StewardDetailResponse:
      type: object
      description: Steward detail response
      required:
      - steward_id
      - steward_did
      - holder_did
      - status
      - term_start
      - term_end
      - bond_amount
      - reputation_score
      - effectiveness_score
      - attestations_issued
      - attestations_disputed
      - disputes_against
      - disputes_won
      - specializations
      - can_attest
      - is_term_expired
      - created_at
      - updated_at
      properties:
        attestations_disputed:
          type: integer
          format: int64
          minimum: 0
        attestations_issued:
          type: integer
          format: int64
          minimum: 0
        bond_amount:
          type: integer
          format: int64
          minimum: 0
        can_attest:
          type: boolean
        created_at:
          type: integer
          format: int64
          minimum: 0
        disputes_against:
          type: integer
          format: int64
          minimum: 0
        disputes_won:
          type: integer
          format: int64
          minimum: 0
        effectiveness_score:
          type: number
          format: double
        holder_did:
          type: string
        is_term_expired:
          type: boolean
        jurisdiction:
          type:
          - string
          - 'null'
        reputation_score:
          type: number
          format: double
        specializations:
          type: array
          items:
            type: string
        status:
          type: string
        steward_did:
          type: string
        steward_id:
          type: string
        term_end:
          type: integer
          format: int64
          minimum: 0
        term_start:
          type: integer
          format: int64
          minimum: 0
        updated_at:
          type: integer
          format: int64
          minimum: 0
    StewardSummaryResponse:
      type: object
      description: Steward summary response (for list endpoints)
      required:
      - steward_id
      - steward_did
      - holder_did
      - status
      - reputation_score
      - attestations_issued
      - can_attest
      - term_end
      properties:
        attestations_issued:
          type: integer
          format: int64
          minimum: 0
        can_attest:
          type: boolean
        holder_did:
          type: string
        jurisdiction:
          type:
          - string
          - 'null'
        reputation_score:
          type: number
          format: double
        status:
          type: string
        steward_did:
          type: string
        steward_id:
          type: string
        term_end:
          type: integer
          format: int64
          minimum: 0
    TimelineEvent:
      type: object
      description: Timeline event
      required:
      - event_type
      - description
      - timestamp
      - date_time
      properties:
        actor:
