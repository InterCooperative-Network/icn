status = "exceeds-spec"
truth_class = "operational"
evidence_type = "test"
evidence = [
  "SDIS complete through Phase S6",
  "Post-quantum crypto (ML-DSA + ML-KEM) operational with feature flags",
  "ZKP credential presentation (3 levels: QR, NFC/BLE, Network)",
  "Steward network with threshold PRF for VUI computation",
  "Age-encrypted keystore, on-disk formats v1-v4 (legacy auto-migration terminates at v3; v4 is written only when SDIS fields are added)",
  "Key recovery: two distinct mechanisms — steward-attested SDIS ceremony and a separate M-of-N trustee scheme (icn-identity/src/recovery.rs)",
]
last_verified = "2026-08-14"
verified_by = "status-refresh-2026-08-14"
review_note = "Re-verified 2026-08-14 at HEAD 74c832f1. Re-traced at source: age/scrypt keystore (keystore.rs:571,610); the format chain header (keystore.rs:4-8) still terminates at v4 with no StoredKeyV5 — the v5 comments at :98,184 label feature-gated optional fields inside StoredKeyV4 (version always 4, :143) and are a naming hazard, not a new format; legacy migration actually ends at v3 (:1098) and a v3 keystore loads without upgrade (:1064), so the previous v1-v4 auto-migration wording overstated the terminal version. Also re-traced: ML-DSA/ML-KEM modules (icn-crypto-pq/src/lib.rs:48-49), the three-level presentation ladder which lives in icn-gateway/src/api/sdis/verify.rs:1-7 rather than icn-zkp and where NFC/BLE is a transport label with no NFC/BLE code in-repo, the 3-of-5 VUI threshold (icn-steward/src/config.rs:61-62), and both recovery mechanisms (icn-steward/src/ceremony/recovery.rs:18 and icn-identity/src/recovery.rs:3, which are different schemes — trustees are arbitrary DIDs, not stewards). CORRECTION: the previous sole gap claimed the enrollment flow was not built. There is indeed no icn-enrollment crate, but enrollment IS built — icn-steward/src/ceremony/enrollment.rs (417 lines) and icn-gateway/src/api/sdis/simple_enrollment.rs (1827 lines) with live routes at :281,:335,:410,:534 registered in sdis/mod.rs:361, plus web/pilot-ui/sdis-enrollment.*. That gap is replaced below by three real gaps found this pass. NOT re-traced and carried forward: SDIS complete through Phase S6, which rests solely on docs/sdis/SDIS_IMPLEMENTATION_PLAN.md:3 asserting its own completion and is not source-checkable; no cargo build or test was run."
