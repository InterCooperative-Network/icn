# was NOT re-confirmed by ops in #2047. It is tagged inline as NEEDS OPS RE-CONFIRMATION
# so it does not ride the fresh date. (See PR #2051 review thread, comment 3410749048.)
review_note = "Re-verified 2026-08-14 at HEAD 74c832f1, code-level only — this is what last_verified attests to. Re-traced at source: quinn + rustls (icn-net/Cargo.toml:13-15); gossip Bloom dedup and anti-entropy (icn-gossip/src/gossip.rs:99-100; anti_entropy.rs:75-92); SignedEnvelope (envelope.rs:61) and EncryptedEnvelope (encryption.rs:123); the icn://did:icn:X@HOST:PORT bootstrap format (handlers/mod.rs:118; bins/icnctl/src/main.rs:1032); the TOFU transport posture (tls.rs:272-279) with identity proven only by the Hello three-fact cert binding (handlers/hello.rs:62-97); and the bootstrap-DID expectation policy, which warns and counts on divergence but keeps the connection and penalises nobody (handlers/mod.rs:297-340, pinned by icn-net/tests/bootstrap_did_expectation.rs, #2533) — a deliberate design choice recorded here as a clarifier, not a defect. DISCONFIRMED AT SOURCE: DHT discovery does not exist. A case-insensitive grep for kademlia|libp2p|dht across icn/crates, icn/bins and icn/apps returns zero hits and there is no such dependency; discovery.rs uses mdns_sd only. The evidence bullet has been corrected — this was a claimed capability with no implementation inside an operational/confirmed list. NAT traversal is also more built than the old gap implied: STUN, TURN, nat and relay_proxy modules exist and are wired into session establishment (session.rs:250,:311); what is absent is direct hole punching (no attempt_hole_punch anywhere), and docs/design/nat-traversal-design.md:3 is itself stale at Design Phase with shipped work still unchecked. NOT covered by this date and NOT re-confirmed: K3s running 2+ months remains a runtime/deployment claim, not source-verifiable (see the carve-out block above, preserved verbatim)."
