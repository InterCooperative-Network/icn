name: Issue Label Enforcer

on:
  issues:
    types: [opened, edited, labeled, unlabeled]

permissions:
  issues: write

jobs:
  enforce-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Check required labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);

            const epics = labels.filter(l => l.startsWith('epic:'));
            const types = labels.filter(l => l.startsWith('type:'));
            const tiers = labels.filter(l => l.startsWith('tier:'));
            const isTrust = labels.includes('epic:trust-hardening');

            const problems = [];

            if (epics.length === 0) {
              problems.push('Missing `epic:*` label');
            } else if (epics.length > 1) {
              problems.push(`Multiple \`epic:*\` labels: ${epics.join(', ')}`);
            }

            if (types.length === 0) {
              problems.push('Missing `type:*` label');
            } else if (types.length > 1) {
              problems.push(`Multiple \`type:*\` labels: ${types.join(', ')}`);
            }

            if (isTrust && tiers.length === 0) {
              problems.push('Trust-hardening issues require a `tier:*` label');
            } else if (tiers.length > 1) {
              problems.push(`Multiple \`tier:*\` labels: ${tiers.join(', ')}`);
            }

            if (problems.length > 0) {
              const body = [
                '**Label check failed.** Every issue needs exactly one `epic:*` and one `type:*` label.',
                '',
                ...problems.map(p => `- ${p}`),
                '',
                'See [ISSUE_POLICY.md](/.github/ISSUE_POLICY.md) for details.'
              ].join('\n');

              // Check if we already commented (avoid spam)
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 10
              });
              const botComment = comments.data.find(
                c => c.user.type === 'Bot' && c.body.includes('Label check failed')
              );

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: body
                });
              }
            }
