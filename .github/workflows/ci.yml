name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # CI gate ratchet phases (observational | warning | blocking)
  GATE_RATCHET_PHASE_MEANING_FIREWALL: blocking
  GATE_RATCHET_PHASE_KERNEL_DEPS: blocking
  GATE_RATCHET_PHASE_FIREWALL_CONTRACT: blocking
  GATE_RATCHET_PHASE_COVERAGE: observational
  GATE_RATCHET_PHASE_SDK_TESTS: blocking
  GATE_RATCHET_PHASE_A11Y: blocking
  GATE_RATCHET_PHASE_COMPLIANCE: blocking
  GATE_RATCHET_PHASE_READINESS: warning
  # Scope controls for staged boundary enforcement
  GATE_RATCHET_KERNEL_DEPS_SCOPE: core-only

permissions:
  contents: read

jobs:
  changes:
    name: Change Scope
    runs-on: ubuntu-latest
    # Job-level elevation: dorny/paths-filter uses the PR API in pull_request
    # mode and documents a pull-requests:read requirement. Kept here so the
    # workflow's top-level contents:read default stays minimal for other jobs.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
      has_rust: ${{ steps.filter.outputs.has_rust }}
      member_shell_relevant: ${{ steps.filter.outputs.member_shell_relevant }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docs_only:
              - 'docs/**'
              - '*.md'
              - '.github/**/*.md'
            # Counter-signal: if any Rust sources changed, never skip required checks
            # even if docs_only misclassifies. Guards against paths-filter edge cases
            # on push events (e.g., sprint-28 squash-merge incident).
            has_rust:
              - 'icn/**/*.rs'
              - 'icn/**/Cargo.toml'
              - 'icn/Cargo.lock'
            # Member Shell relevance is a POSITIVE filter, deliberately not derived
            # from docs_only: with paths-filter's default some-quantifier, docs_only
            # is true whenever ANY changed file matches a docs pattern, so a mixed
            # docs+frontend PR would read as "docs only" and skip the shell gate
            # (this very workflow's own first PR skipped itself that way). Covers
            # the surface, its drivers/fixtures, the borrowed pilot-ui organizer
            # pack + the dependency tree the drivers borrow, both validators, and
            # this workflow file.
            member_shell_relevant:
              - 'web/member-shell/**'
              - 'web/rehearsal-landing/**'
              - 'web/pilot-ui/fixtures/icn-organizer-demo/**'
              - 'web/pilot-ui/package.json'
              - 'web/pilot-ui/package-lock.json'
              - 'docs/scripts/validate-rehearsal-shell-fixtures.py'
              - 'docs/scripts/check-member-shell-fixture-binding.py'
              - '.github/workflows/ci.yml'

  secrets-check:
    name: Secrets Placeholder Check
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check for placeholder secrets in deployable manifests
        run: |
          echo "Checking for placeholder secrets in deployment files..."

          # Define patterns that indicate placeholder secrets (in value positions)
          # These patterns look for actual secret values, not comments
          PLACEHOLDERS='change-me-in-production|changeme|your-secret-here'

          FAILED=false

          # Check Kubernetes manifests (excluding .example files and comments)
          for file in $(find deploy -name "*.yaml" -o -name "*.yml" | grep -v '\.example'); do
            # Only check lines that aren't comments (don't start with #) and contain key: value patterns
            if grep -v '^\s*#' "$file" 2>/dev/null | grep -qiE "$PLACEHOLDERS"; then
              echo "ERROR: Placeholder secret found in $file"
              grep -v '^\s*#' "$file" | grep -niE "$PLACEHOLDERS" || true
              FAILED=true
            fi
          done

          # Check for non-example secret.yaml files that shouldn't exist
          for file in $(find deploy -name "secret.yaml" -o -name "secrets.yaml" 2>/dev/null); do
            echo "ERROR: Secret file found that should be .example: $file"
            FAILED=true
          done

          if [ "$FAILED" = "true" ]; then
            echo ""
            echo "FAILURE: Found placeholder secrets or non-example secret files."
            echo "See https://github.com/InterCooperative-Network/icn/blob/main/deploy/README.md for safe secret provisioning."
            exit 1
          fi

          echo "All deployment files pass secret checks."

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pin to the project toolchain so rustfmt rules stay stable.
      # Using @stable here causes drift every 6-week Rust release cycle.
      # Format Check always runs — the docs_only fast path previously caused
      # silent format regressions to land on main undetected (sprint-28 incident).
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check
        working-directory: ./icn

  meaning-firewall:
    name: Meaning Firewall Check
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check kernel/app separation
        run: |
          set -euo pipefail
          if ./scripts/check-meaning-firewall.sh; then
            echo "Meaning Firewall check passed"
            exit 0
          fi

          PHASE="${GATE_RATCHET_PHASE_MEANING_FIREWALL}"
          echo "Ratchet phase: $PHASE"
          if [ "$PHASE" != "observational" ]; then
            echo "::warning title=Meaning Firewall violated::Meaning Firewall violations detected. Phase=$PHASE. See docs/ci/GATE_RATCHET_PLAN.md"
          fi
          echo "WARNING: Meaning Firewall violations detected. See docs/ci/GATE_RATCHET_PLAN.md"
          if [ "$PHASE" = "blocking" ]; then
            echo "::error title=Meaning Firewall (blocking)::Failing CI because phase=blocking and Meaning Firewall violations were detected."
            echo "BLOCKING: failing CI due to Meaning Firewall violations"
            exit 1
          fi

          echo "Non-blocking phase ($PHASE): allowing CI to continue"
          exit 0

  kernel-deps:
    name: Kernel Forbidden Dependencies
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        uses: ./.github/actions/install-build-tools

      - uses: dtolnay/rust-toolchain@1.95.0

      - name: Check kernel crates for forbidden deps (bash version)
        run: |
          set -euo pipefail
          SCOPE="${GATE_RATCHET_KERNEL_DEPS_SCOPE}"
          case "$SCOPE" in
            core-only)
              KERNEL_CRATES=("icn-core")
              ;;
            all-kernel)
              KERNEL_CRATES=("icn-core" "icn-net" "icn-gossip")
              ;;
            *)
              echo "Unknown GATE_RATCHET_KERNEL_DEPS_SCOPE: $SCOPE"
              exit 1
              ;;
          esac
          FORBIDDEN=("icn-trust" "icn-governance" "icn-ledger" "icn-ccl" "icn-compute" "icn-entity" "icn-community" "icn-federation" "icn-steward")
          PHASE="${GATE_RATCHET_PHASE_KERNEL_DEPS}"
          ALLOWLIST_FILE="../scripts/forbidden-deps-allowlist.txt"
          violations=()
          echo "Ratchet phase: $PHASE"
          echo "Kernel dependency check scope: $SCOPE (${KERNEL_CRATES[*]})"
          echo "Accepted scopes: core-only | all-kernel"
          echo "Rollout: Wave 2 (core-only) enforcement active when scope=core-only and phase=blocking"
          if [ -f "$ALLOWLIST_FILE" ]; then
            # Read allowlist, filtering out comments and empty lines
            mapfile -t ALLOWLIST < <(grep -v '^\s*#' "$ALLOWLIST_FILE" | grep -v '^\s*$')
          else
            ALLOWLIST=()
          fi
          for crate in "${KERNEL_CRATES[@]}"; do
            for dep in "${FORBIDDEN[@]}"; do
              if cargo tree -p "$crate" --edges normal | grep -q "\\b${dep}\\b"; then
                entry="${crate}->${dep}"
                if printf '%s\n' "${ALLOWLIST[@]}" | grep -qx "$entry"; then
                  echo "Allowed dependency (allowlist): ${entry}"
                else
                  violations+=("$entry")
                fi
              fi
            done
          done

          if [ "${#violations[@]}" -gt 0 ]; then
            if [ "$PHASE" != "observational" ]; then
              echo "::warning title=Kernel dependency boundary violated::Forbidden dependency edges detected in scope=$SCOPE phase=$PHASE. See docs/ci/GATE_RATCHET_PLAN.md"
            fi
            printf 'WARNING: Forbidden kernel dependency edges detected:\n'
            printf '  - %s\n' "${violations[@]}"
            if [ "$PHASE" != "observational" ]; then
              for v in "${violations[@]}"; do
                echo "::warning title=Forbidden kernel dep edge::$v"
              done
            fi
            echo
            echo "Remediation order:"
            echo "  1) Remove the dependency from icn-core (preferred)"
            echo "  2) Move the dependency behind a kernel API/service boundary"
            echo "  3) If this edge is temporarily unavoidable, add a scoped entry to: $ALLOWLIST_FILE"
            echo
            echo "Reference: docs/ci/GATE_RATCHET_PLAN.md"
            echo

            if [ "$PHASE" = "blocking" ]; then
              echo "::error title=Kernel dependency boundary (blocking)::Failing CI because phase=blocking and forbidden edges were found. Fix or add scoped allowlist entry."
              echo "BLOCKING: failing CI due to forbidden kernel dependencies"
              exit 1
            fi

            echo "Non-blocking phase ($PHASE): allowing CI to continue"
          fi
        working-directory: ./icn

  firewall-contract:
    name: Firewall Contract Enforcement
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.95.0

      - name: Run firewall denylist check
        run: |
          set -euo pipefail
          if python3 .github/scripts/firewall_denylist.py; then
            echo "Firewall contract check passed"
            exit 0
          fi

          PHASE="${GATE_RATCHET_PHASE_FIREWALL_CONTRACT}"
          echo "Ratchet phase: $PHASE"
          if [ "$PHASE" != "observational" ]; then
            echo "::warning title=Firewall contract violated::Firewall contract violations detected. Phase=$PHASE. See docs/ci/GATE_RATCHET_PLAN.md"
          fi
          echo "WARNING: Firewall contract violations detected. See docs/ci/GATE_RATCHET_PLAN.md"
          if [ "$PHASE" = "blocking" ]; then
            echo "::error title=Firewall contract (blocking)::Failing CI because phase=blocking and firewall contract violations were detected."
            echo "BLOCKING: failing CI due to firewall contract violations"
            exit 1
          fi

          echo "Non-blocking phase ($PHASE): allowing CI to continue"
          exit 0

  compliance-linter:
    name: Regulatory Compliance Linter
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run compliance linter
        run: |
          set -euo pipefail
          if python3 .github/scripts/compliance_linter.py; then
            echo "Compliance linter passed"
            exit 0
          fi

          PHASE="${GATE_RATCHET_PHASE_COMPLIANCE}"
          echo "Ratchet phase: $PHASE"
          if [ "$PHASE" != "observational" ]; then
            echo "::warning title=Compliance violations detected::Forbidden terminology in public API surfaces. Phase=$PHASE. See docs/dev/language-guide.md"
          fi
          echo "WARNING: Compliance violations detected. See docs/dev/language-guide.md"
          if [ "$PHASE" = "blocking" ]; then
            echo "::error title=Compliance linter (blocking)::Failing CI because phase=blocking and compliance violations were detected."
            echo "BLOCKING: failing CI due to compliance violations"
            exit 1
          fi

          echo "Non-blocking phase ($PHASE): allowing CI to continue"
          exit 0

  readiness-overclaim:
    name: Readiness Overclaim Check
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Self-test the readiness linter
        run: python3 .github/scripts/test_readiness_overclaim_linter.py

      - name: Run readiness overclaim linter
        run: |
          set -euo pipefail
          if python3 .github/scripts/readiness_overclaim_linter.py; then
            echo "Readiness overclaim check passed"
            exit 0
          fi

          PHASE="${GATE_RATCHET_PHASE_READINESS}"
          echo "Ratchet phase: $PHASE"
          if [ "$PHASE" != "observational" ]; then
            echo "::warning title=Readiness overclaim detected::Un-disclaimed production/live-federation readiness claim in active deployment guidance. Phase=$PHASE. See docs/dev/language-guide.md and docs/ci/GATE_RATCHET_PLAN.md"
          fi
          echo "WARNING: Readiness overclaim detected. See docs/dev/language-guide.md"
          if [ "$PHASE" = "blocking" ]; then
            echo "::error title=Readiness overclaim (blocking)::Failing CI because phase=blocking and a readiness overclaim was detected."
            echo "BLOCKING: failing CI due to readiness overclaim"
            exit 1
          fi
          echo "Non-blocking phase ($PHASE): allowing CI to continue"
          exit 0

  clippy:
    name: Clippy
    needs: [changes]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Skip only when docs_only AND no Rust files changed (dual-signal guard).
      # Requiring both prevents silent skips when paths-filter misclassifies a push.
      - name: Docs-only fast path
        if: needs.changes.outputs.docs_only == 'true' && needs.changes.outputs.has_rust != 'true'
        run: echo "Confirmed docs-only (no Rust files); skipping clippy."

      - name: Free disk space
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
        uses: ./.github/actions/free-disk-space

      - name: Install build tools
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
        uses: ./.github/actions/install-build-tools

      # Pin to project toolchain — clippy lints evolve with every stable release.
      # Floating @stable would cause lint failures/false-passes on the 6-week cycle.
      - uses: dtolnay/rust-toolchain@1.95.0
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
        with:
          workspaces: "icn -> target"
          cache-on-failure: true
          prefix-key: "v1-rust-ci"

      - name: Run Clippy
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
        run: cargo clippy --workspace --all-targets --features "hsm,post-quantum" -- -D warnings
        working-directory: ./icn

  test:
    name: Test
    needs: [changes]
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Docs-only fast path
        if: needs.changes.outputs.docs_only == 'true' && needs.changes.outputs.has_rust != 'true'
        run: echo "Confirmed docs-only (no Rust files); skipping test suites."

      - name: Free disk space
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
        uses: ./.github/actions/free-disk-space
        with:
          verbose: 'true'
          aggressive: 'true'

      - name: Install build tools
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
        uses: ./.github/actions/install-build-tools

      - uses: dtolnay/rust-toolchain@1.95.0
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'

      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
        with:
          workspaces: "icn -> target"
          cache-on-failure: true
          prefix-key: "v1-rust-ci"

      - name: Run unit tests (parallel)
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
        run: cargo test --workspace --lib
        working-directory: ./icn

      - name: Run integration tests (serial to avoid port conflicts)
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
        run: cargo test --workspace --test '*' -- --test-threads=1
        working-directory: ./icn

      - name: Run sled storage tests
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
        run: cargo test -p icn-gateway --features sled-storage
        working-directory: ./icn

  backup-validation:
    name: Backup Validation
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Install build tools
        uses: ./.github/actions/install-build-tools

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "icn -> target"
          cache-on-failure: true
          prefix-key: "v1-rust-ci"

      - name: Build icnctl
        run: cargo build -p icnctl --release
        working-directory: ./icn

      - name: Create test identity and backup
        run: |
          export ICN_PASSPHRASE="ci-test-passphrase-$(date +%s)"
          export DATA_DIR=$(mktemp -d)
          export BACKUP_FILE=$(mktemp).tar

          echo "Creating test identity..."
          ./target/release/icnctl --data-dir "$DATA_DIR" id init

          echo "Creating backup..."
          ./target/release/icnctl --data-dir "$DATA_DIR" backup "$BACKUP_FILE"

          echo "Verifying backup..."
          ./target/release/icnctl verify-backup "$BACKUP_FILE"

          echo "Cleanup..."
          rm -rf "$DATA_DIR" "$BACKUP_FILE"
        working-directory: ./icn

  coverage:
    name: Test Coverage
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # Gate is observational — job failure must never block CI or merges.
    # Previously ran on [self-hosted, linux, x64, homelab] (ci-runner, 6GB RAM),
    # which OOMed on instrumented workspace compilation. Moved to ubuntu-latest
    # with rust-cache to remove homelab runner dependency for coverage entirely.
    continue-on-error: true
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        uses: ./.github/actions/free-disk-space
        with:
          verbose: 'false'
          aggressive: 'true'

      - name: Install build tools
        uses: ./.github/actions/install-build-tools

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "icn -> target"
          cache-on-failure: true
          prefix-key: "v1-rust-coverage"

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path ./lcov.info
        working-directory: ./icn
        continue-on-error: ${{ env.GATE_RATCHET_PHASE_COVERAGE != 'blocking' }}

      - name: Upload coverage to Codecov
        if: hashFiles('./icn/lcov.info') != ''
        uses: codecov/codecov-action@v6
        with:
          files: ./icn/lcov.info
          fail_ci_if_error: false

  security:
    name: Security Audit
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        uses: ./.github/actions/install-build-tools

      - uses: dtolnay/rust-toolchain@1.95.0

      - name: Install security tools
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: Run cargo-audit
        run: cargo audit
        working-directory: ./icn

      - name: Run cargo-deny advisories check
        run: cargo deny check advisories
        working-directory: ./icn

      - name: Run cargo-deny licenses check
        run: cargo deny check licenses
        working-directory: ./icn

  build:
    name: Build Release
    needs: [changes]
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Docs-only fast path
        if: needs.changes.outputs.docs_only == 'true' && needs.changes.outputs.has_rust != 'true'
        run: echo "Confirmed docs-only (no Rust files); skipping release build."

      - name: Free disk space
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
        uses: ./.github/actions/free-disk-space
        with:
          aggressive: 'true'

      - name: Install build tools
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
        uses: ./.github/actions/install-build-tools

      - uses: dtolnay/rust-toolchain@1.95.0
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'

      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
        with:
          workspaces: "icn -> target"
          cache-on-failure: true
          prefix-key: "v1-rust-ci"

      - name: Build release binaries
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
        run: cargo build --release
        working-directory: ./icn

      - name: Upload binaries
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: icn-binaries
          path: |
            icn/target/release/icnd
            icn/target/release/icnctl
            icn/target/release/icn-console

  sdk:
    name: TypeScript SDK
    needs: [changes]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sdk/typescript
    steps:
      - uses: actions/checkout@v6

      # Docs-only fast path — job must always run (not be skipped) so it
      # satisfies branch protection required checks on docs-only PRs.
      - name: Docs-only fast path
        if: needs.changes.outputs.docs_only == 'true' && needs.changes.outputs.has_rust != 'true'
        run: echo "Confirmed docs-only (no SDK files); skipping TypeScript SDK tests."

      # Ties the hand-written SDK docs/examples to the client's actually-exported
      # methods and the canonical settle/position/unit ledger vocabulary, failing
      # if deprecated pay/balance/escrow/recurring fintech terms (or methods that
      # were never shipped) are presented as current API. Runs on every SDK change
      # incl. docs-only — examples/ are not covered by tsc (rootDir: src). Needs
      # only python3 (preinstalled). See sdk/typescript/check_sdk_doc_terms.py and
      # docs/adr/ADR-0006.
      - name: SDK docs use canonical ICN ledger primitives (no pay/balance/escrow as current)
        run: python3 check_sdk_doc_terms.py --sdk-root .
        continue-on-error: false

      - name: Free disk space
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
        uses: ./.github/actions/free-disk-space

      - uses: actions/setup-node@v6
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
        run: npm ci

      - name: Build SDK
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
        run: npm run build

      # examples/ are not part of the library build (tsconfig.json is src-only),
      # so example API/field drift — wrong methods, stale fields, wrong event
      # envelope shape — escaped tsc. tsconfig.examples.json typechecks them
      # against the real SDK source (compile-only, no gateway). This is the
      # structural complement to the docs-vocabulary guard (check_sdk_doc_terms.py).
      - name: Typecheck examples
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
        run: npm run typecheck:examples

      - name: Run tests
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
        # All SDK tests use mockFetch — no gateway required. Gate is blocking.
        run: npm test

  web-ui:
    name: Web UI
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web/pilot-ui
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/pilot-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  accessibility:
    name: Accessibility Tests
    needs: [changes]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web/pilot-ui
    steps:
      - uses: actions/checkout@v6

      # Docs-only fast path — job must always run so it satisfies branch protection required checks
      - name: Docs-only fast path
        if: needs.changes.outputs.docs_only == 'true' && needs.changes.outputs.has_rust != 'true'
        run: echo "Confirmed docs-only (no frontend files); skipping accessibility tests."

      - uses: actions/setup-node@v6
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/pilot-ui/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run accessibility tests
        if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
        # All tests run against chromium only (CI installs chromium; other browsers need separate runner setup).
        # Gate is blocking — 16/16 chromium tests pass cleanly. Graduated 2026-03-24.
        run: npm run test:a11y:ci

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-report
          path: web/pilot-ui/test-results/

  # Member Shell (web/member-shell) is the CURRENT member/organizer rehearsal
  # surface; until this job existed its browser tests were dev-tools only, so
  # the surface could drift or stop working while unrelated CI stayed green
  # (2026-07-13 ecosystem audit finding). Runs the four fail-closed test
  # drivers documented in web/member-shell/README.md against a static serve of
  # web/ (no gateway, no outbound app traffic — the organizer flow is
  # route-intercepted by organizer-mock.cjs), plus the fixture-pack content
  # validator and the shell.js fixture-binding drift check.
  # An automated pass here is NOT the human assistive-technology gate (#2041).
  member-shell:
    name: Member Shell Tests
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # No-op fast path — the job itself always runs (so it can satisfy branch
      # protection if/when it joins the required set) but only skips substance
      # when NO member-shell-relevant path changed. Deliberately NOT keyed on
      # docs_only: that filter is some-quantified and misreads mixed
      # docs+frontend PRs as docs-only (this job's own first PR skipped itself
      # that way — run 29291254970).
      - name: No-op fast path (no member-shell-relevant changes)
        if: needs.changes.outputs.member_shell_relevant != 'true'
        run: echo "No member-shell-relevant paths changed; passing as a no-op."

      - uses: actions/setup-node@v6
        if: needs.changes.outputs.member_shell_relevant == 'true'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/pilot-ui/package-lock.json

      # The member-shell drivers deliberately borrow Playwright + axe from
      # web/pilot-ui's devDependencies (#1735) — no second dependency tree.
      - name: Install dependencies (borrowed from web/pilot-ui)
        if: needs.changes.outputs.member_shell_relevant == 'true'
        working-directory: ./web/pilot-ui
        run: npm ci

      - name: Install Playwright browsers
        if: needs.changes.outputs.member_shell_relevant == 'true'
        working-directory: ./web/pilot-ui
        run: npx playwright install --with-deps chromium

      - name: Fixture validation (content + consumer binding)
        if: needs.changes.outputs.member_shell_relevant == 'true'
        run: |
          # The pack validator imports jsonschema; install explicitly (as the
          # docs-freshness fixture-bundle job does) rather than relying on the
          # runner image happening to ship it.
          python3 -m pip install jsonschema
          python3 docs/scripts/validate-rehearsal-shell-fixtures.py
          python3 docs/scripts/check-member-shell-fixture-binding.py

      - name: Run member-shell browser tests
        if: needs.changes.outputs.member_shell_relevant == 'true'
        run: |
          # Serve the web/ root (the shell's relative fixture fetches require it).
          (cd web && python3 -m http.server 8099 --bind 127.0.0.1 &)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/member-shell/index.html > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8099/member-shell/index.html > /dev/null
          export NODE_PATH="$GITHUB_WORKSPACE/web/pilot-ui/node_modules"
          mkdir -p member-shell-a11y-out
          node web/member-shell/pending-publish.test.cjs    http://127.0.0.1:8099
          node web/member-shell/a11y-walkthrough.cjs        http://127.0.0.1:8099 ./member-shell-a11y-out
          node web/member-shell/organizer-workflow.test.cjs http://127.0.0.1:8099
          node web/member-shell/organizer-a11y.cjs          http://127.0.0.1:8099 ./member-shell-a11y-out

      - name: Upload member-shell a11y reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: member-shell-a11y-report
          path: member-shell-a11y-out/
          if-no-files-found: ignore

  pilot-provenance:
    name: Pilot Provenance Invariant
    if: needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, test]
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Install build tools
        uses: ./.github/actions/install-build-tools

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "icn -> target"
          cache-on-failure: true
          prefix-key: "v1-rust-ci"

      - name: Run pilot chain demo
        env:
          PILOT_DETERMINISTIC: "1"
        run: ./scripts/pilot_chain_demo.sh
