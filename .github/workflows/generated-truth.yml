name: Generated-truth drift

# Observational drift guard for generated orientation/reference artifacts and the
# agent/plugin validation tooling. These artifacts are Canonical: no: they route
# toward registered owners/current evidence and never become a universal project
# state root. The narrow STATE.md check below is retained only to keep that legacy
# narrative from contradicting merge history; it does not restore STATE/PHASE as
# agent authority. Staleness is a warning. The job fails only when a checker itself
# errors. See docs/ci/GENERATED_TRUTH_DRIFT.md.

on:
  pull_request:
    paths:
      - 'scripts/generate-agent-context-spine.py'
      - 'scripts/check-agent-context-spine.py'
      - 'scripts/generate_repo_record.py'
      - 'scripts/check-claude-plugin.py'
      - 'scripts/check-claude-plugin-root-resolution.py'
      - 'scripts/generate-live-state-overlay.py'
      - 'docs/reference/project-index/generated/**'
      - 'docs/ai/ICN_LIVE_STATE_OVERLAY_TEMPLATE.md'
      - 'tools/claude-code/plugins/**'
      - 'scripts/check-state-lag.py'
      - 'docs/STATE.md'
      - '.github/workflows/generated-truth.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/generate-agent-context-spine.py'
      - 'scripts/check-agent-context-spine.py'
      - 'scripts/generate_repo_record.py'
      - 'scripts/check-claude-plugin.py'
      - 'scripts/check-claude-plugin-root-resolution.py'
      - 'scripts/generate-live-state-overlay.py'
      - 'docs/reference/project-index/generated/**'
      - 'docs/ai/ICN_LIVE_STATE_OVERLAY_TEMPLATE.md'
      - 'tools/claude-code/plugins/**'
      - 'scripts/check-state-lag.py'
      - 'docs/STATE.md'
      - '.github/workflows/generated-truth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-truth:
    name: Generated-truth drift (observational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: check-state-lag.py's historical-narrative advisory
          # counts commits since docs/STATE.md was last edited. On a shallow
          # checkout that count is wrong, so the script skips the advisory.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Generated navigation: source files/registries remain authoritative.
      - name: Agent context spine — valid + fresh
        run: |
          python3 scripts/check-agent-context-spine.py && rc=0 || rc=$?
          if [ "${rc:-0}" = "0" ]; then
            echo "Agent context spine is valid and current."
          else
            echo "::warning::agent-context-spine drift/validation issue (exit $rc). Regenerate: python3 scripts/generate-agent-context-spine.py --write"
          fi

      - name: Claude plugin skeleton portability
        run: |
          python3 scripts/check-claude-plugin.py && rc=0 || rc=$?
          if [ "${rc:-0}" = "0" ]; then
            echo "Claude plugin skeleton OK."
          else
            echo "::warning::check-claude-plugin.py reported an issue (exit $rc)."
          fi

      - name: Claude plugin root resolution
        run: |
          python3 scripts/check-claude-plugin-root-resolution.py && rc=0 || rc=$?
          if [ "${rc:-0}" = "0" ]; then
            echo "Claude plugin root-resolution OK."
          else
            echo "::warning::check-claude-plugin-root-resolution.py reported an issue (exit $rc)."
          fi

      # Live-state overlay is on-demand with NO committed snapshot. --check
      # validates the owner-derived structure, memory-only handoff label, JSON
      # round-trip, and that --no-gh mode invents no GitHub state.
      - name: Live-state overlay generator smoke (--check, offline)
        run: |
          python3 scripts/generate-live-state-overlay.py --check --no-gh && rc=0 || rc=$?
          if [ "${rc:-0}" = "0" ]; then
            echo "Live-state overlay generator self-check passed."
          else
            echo "::warning::generate-live-state-overlay.py --check failed (exit $rc) — generator regression."
          fi

      # Periodic file-record projection. It legitimately lags between refreshes.
      # exit 0=current, 1=stale warning, >=2=checker failure.
      - name: Repo file-record snapshot drift (warn on stale)
        run: |
          python3 scripts/generate_repo_record.py --repo icn=. --check && rc=0 || rc=$?
          if [ "${rc:-0}" = "0" ]; then
            echo "Repo file-record snapshot is current."
          elif [ "${rc:-0}" = "1" ]; then
            echo "::warning::docs/reference/project-index/generated/icn-file-record.{json,md} is stale vs the working tree. Regenerate (generated-only commit): python3 scripts/generate_repo_record.py --repo icn=. --out docs/reference/project-index/generated"
          else
            echo "::error::generate_repo_record.py --check errored (exit $rc) — checker error, not a staleness signal."
            exit "$rc"
          fi

      # Legacy STATE narrative consistency only. This detects one narrow class of
      # misleading historical/current prose: a newest sync block saying work is
      # unmerged/not-on-main when git proves it merged. It does NOT make STATE.md
      # the owner of current project truth.
      - name: Legacy STATE narrative lag (STATE.md vs merge history)
        run: |
          python3 scripts/check-state-lag.py && rc=0 || rc=$?
          if [ "${rc:-0}" = "0" ]; then
            echo "docs/STATE.md newest sync block does not contradict merge history in the checked form."
          elif [ "${rc:-0}" = "1" ]; then
            echo "::warning::docs/STATE.md's newest sync block asserts a PR/issue is unmerged/not-on-main that git shows merged. Refresh that narrative block. Audit all blocks: python3 scripts/check-state-lag.py --all"
          else
            echo "::error::check-state-lag.py errored (exit $rc) — checker error, not a lag signal."
            exit "$rc"
          fi
