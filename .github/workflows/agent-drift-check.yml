name: Agent Drift Check

on:
  push:
    branches: [main]
    paths:
      # .agents/** is the tree skills.json calls canonical for ICN-level skills; without it a
      # change to the authoritative copy did not even trigger this workflow (icn#2633).
      - '.agents/**'
      - '.claude/**'
      - 'ops/automation/skills/**'
      - 'scripts/check-skill-registry.py'
      - 'scripts/check-agent-capabilities.py'
      - 'scripts/check-agent-runtime-adoption.py'
      - 'scripts/generate-agent-capabilities.py'
      - 'ops/mcp/src/**'
      - 'ops/scripts/**'
      - 'scripts/tests/test_skill_registry_invariants.py'
      - 'ops/scripts/setup-skill-symlinks.sh'
      - 'ops/state/truth/**'
      - 'ops/scripts/drift-check.sh'
      - 'scripts/check-preflight-consistency.sh'
      - 'scripts/check-truth-spine.py'
      - 'scripts/tests/test_public_docs_boundary.py'
      - 'ops/state/config/**'
      - 'CLAUDE.md'
      - 'ops/CLAUDE.md'
      - 'AGENTS.md'
      # icn#2393 public docs/agent/test address-boundary surfaces
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'web/pilot-ui/tests/**'
      - '.github/agents/**'
      - 'icn/crates/icn-gateway/src/api/sdis/simple_enrollment.rs'
  pull_request:
    # No paths filter: run on ALL PRs so any new skill/agent is checked for truth_contract
    # and registry entries. The check is fast (~5s) and catches silent drift early.
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  drift-check:
    name: Agent Tooling Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify canonical truth files exist
        run: bash ops/scripts/drift-check.sh

      - name: Preflight/root guidance consistency (Refs icn#2140)
        run: bash scripts/check-preflight-consistency.sh

      - name: Skill registry ownership is mechanically true (Refs icn#2633)
        run: python3 scripts/check-skill-registry.py --verbose

      - name: Skill registry enforcement rejects its own violations (Refs icn#2633)
        run: python3 scripts/tests/test_skill_registry_invariants.py

      - name: Truth-spine validation (warning-mode, Refs icn#2141)
        run: python3 scripts/check-truth-spine.py

      # The capability manifest introspects the LIVE MCP server, so it needs the server built.
      # This is what makes "add a capability in its canonical place and agents discover it" an
      # enforced property: forgetting to regenerate fails here (Refs icn#2653).
      - name: Build ops MCP (required for capability introspection)
        run: npm --prefix ops/mcp ci && npm --prefix ops/mcp run build

      - name: Agent capability manifest matches the real runtime surface (Refs icn#2653)
        run: python3 scripts/check-agent-capabilities.py

      - name: Lifecycle hooks and provider MCP routes are still wired (Refs icn#2653)
        run: python3 scripts/check-agent-runtime-adoption.py --verbose

      - name: Capability discovery behaves as advertised (Refs icn#2653)
        run: bash scripts/test-agent-capability-discovery.sh

      - name: Safe wait primitives reject the known non-terminating patterns (Refs icn#2653)
        run: bash scripts/test-icn-wait.sh


      - name: Public docs address-boundary guard tests (Refs icn#2393)
        run: python3 scripts/tests/test_public_docs_boundary.py

      - name: Sprint-state currency + SessionStart source guard tests (Refs icn#2634)
        run: python3 scripts/tests/test_sprint_state_invariants.py

      - name: SessionStart hook runs and degrades honestly (Refs icn#2634)
        run: |
          set -euo pipefail
          out="$(CLAUDE_PROJECT_DIR="$PWD" ./.claude/hooks/session-orient.sh)"
          echo "$out"
          echo "$out" | grep -q '^ICN Session | branch: ' \
            || { echo "session-orient.sh did not emit the orientation line"; exit 1; }
          echo "$out" | grep -qE 'sprint: (none active|[0-9]+ \(|unresolved)' \
            || { echo "session-orient.sh emitted no resolvable sprint state"; exit 1; }

      - name: Validate JSON truth files are parseable
        run: |
          set -e
          for f in \
            ops/state/truth/sources.json \
            ops/state/truth/policy.json \
            ops/state/truth/agents.json \
            ops/state/truth/skills.json \
            ops/state/config/repo-map.json \
            ops/state/sprint/current.json; do
            python3 -c "import json; json.load(open('${f}'))" && echo "OK: ${f}"
          done

      - name: Verify what-matters-now script runs without errors
        run: bash ops/scripts/what-matters-now.sh --drift
