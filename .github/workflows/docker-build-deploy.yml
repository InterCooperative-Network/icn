# Full CI/CD workflow with self-hosted runner
# Copy this to .github/workflows/docker-build-deploy.yml after setting up the runner

name: Build and Deploy to K3s

on:
  push:
    branches: [main]
    paths:
      - 'icn/**'
      - 'Dockerfile'
      - '.github/workflows/docker-build-deploy.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to K3s after build'
        required: true
        default: 'true'
        type: boolean
  schedule:
    # Run cleanup weekly on Sunday at 3am UTC
    - cron: '0 3 * * 0'

env:
  IMAGE_NAME: icn
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # Standard CI jobs run on GitHub-hosted runners
  test:
    name: Test
    runs-on: ubuntu-latest
    # Skip test on scheduled runs (cleanup only)
    if: github.event_name != 'schedule'
    steps:
      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          echo "Removing preinstalled software to free space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/node
          sudo rm -rf /opt/hostedtoolcache/Python
          sudo rm -rf /opt/hostedtoolcache/Ruby
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/vcpkg
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /imagegeneration
          docker system prune -af || true
          sudo apt-get clean || true
          echo "Disk space after cleanup:"
          df -h /

      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "icn -> target"
      - name: Run tests
        run: cargo test --workspace
        working-directory: ./icn

  # Build and deploy runs on self-hosted runner
  build-and-deploy:
    name: Build and Deploy
    needs: test
    runs-on: [self-hosted, homelab, k3s]
    # Skip build/deploy on scheduled runs (cleanup only)
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          echo "Building image ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -f Dockerfile ./icn
          docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${{ env.IMAGE_NAME }}:latest
          echo "✓ Image built successfully"

      - name: Save and distribute to all nodes
        run: |
          echo "Saving Docker image..."
          docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -o /tmp/icn-image.tar

          echo "Importing to control node..."
          sudo k3s ctr images import /tmp/icn-image.tar

          echo "Distributing to worker nodes..."
          WORKERS="10.8.10.41 10.8.10.42"
          for WORKER in $WORKERS; do
            echo "  → Importing to $WORKER..."
            cat /tmp/icn-image.tar | ssh -o BatchMode=yes ubuntu@$WORKER "sudo k3s ctr images import -" || {
              echo "  ⚠ Failed to import to $WORKER (node may be down)"
            }
          done

          # Also import latest tag
          docker save ${{ env.IMAGE_NAME }}:latest -o /tmp/icn-latest.tar
          sudo k3s ctr images import /tmp/icn-latest.tar
          for WORKER in $WORKERS; do
            cat /tmp/icn-latest.tar | ssh -o BatchMode=yes ubuntu@$WORKER "sudo k3s ctr images import -" 2>/dev/null || true
          done

          # Cleanup
          rm -f /tmp/icn-image.tar /tmp/icn-latest.tar

          echo "✓ Image distributed to all nodes"

          # Verify on all nodes
          echo "Images on control:"
          sudo k3s ctr images ls | grep "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" | head -1 || true
          for WORKER in $WORKERS; do
            echo "Images on $WORKER:"
            ssh -o BatchMode=yes ubuntu@$WORKER "sudo k3s ctr images ls | grep '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}' | head -1" || true
          done

      - name: Deploy to K3s
        if: ${{ github.event.inputs.deploy != 'false' }}
        run: |
          echo "Deploying to K3s..."

          # Update main daemon
          sudo kubectl -n icn set image deployment/icn-daemon icnd=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          # Update coop nodes
          for COOP in alpha beta gamma delta; do
            NS="icn-coop-${COOP}"
            if sudo kubectl get namespace ${NS} &>/dev/null; then
              echo "Updating icn-${COOP}..."
              sudo kubectl -n ${NS} set image deployment/icn-${COOP} icnd=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} 2>/dev/null || true
            fi
          done

          # Restart deployments
          sudo kubectl -n icn rollout restart deployment/icn-daemon
          for COOP in alpha beta gamma delta; do
            NS="icn-coop-${COOP}"
            if sudo kubectl get namespace ${NS} &>/dev/null; then
              sudo kubectl -n ${NS} rollout restart deployment/icn-${COOP} 2>/dev/null || true
            fi
          done

          echo "✓ Deployment initiated"

      - name: Wait for rollout
        if: ${{ github.event.inputs.deploy != 'false' }}
        run: |
          echo "Waiting for rollout..."
          sudo kubectl -n icn rollout status deployment/icn-daemon --timeout=180s

          for COOP in alpha beta gamma delta; do
            NS="icn-coop-${COOP}"
            if sudo kubectl get namespace ${NS} &>/dev/null; then
              sudo kubectl -n ${NS} rollout status deployment/icn-${COOP} --timeout=120s 2>/dev/null || true
            fi
          done

          echo "✓ Rollout complete"

      - name: Show deployment status
        if: always()
        run: |
          echo "=== Pod Status ==="
          sudo kubectl get pods -A | grep icn || true

          echo ""
          echo "=== Recent Events ==="
          sudo kubectl -n icn get events --sort-by='.lastTimestamp' | tail -10 || true

      - name: Output summary
        run: |
          echo "## Deployment Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Pods" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          sudo kubectl get pods -A | grep icn >> $GITHUB_STEP_SUMMARY || echo "No pods found" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # Cleanup old images (runs weekly)
  cleanup:
    name: Cleanup Old Images
    runs-on: [self-hosted, homelab, k3s]
    if: github.event_name == 'schedule'
    steps:
      - name: Remove old images on all nodes
        run: |
          echo "Cleaning up old images on all nodes..."
          WORKERS="10.8.10.41 10.8.10.42"

          # Cleanup on control node
          echo "Cleaning control node..."
          sudo k3s ctr images ls | grep "docker.io/library/icn:" | sort -r | tail -n +6 | awk '{print $1}' | xargs -r sudo k3s ctr images rm 2>/dev/null || true

          # Cleanup on worker nodes
          for WORKER in $WORKERS; do
            echo "Cleaning $WORKER..."
            ssh -o BatchMode=yes ubuntu@$WORKER "sudo k3s ctr images ls | grep 'docker.io/library/icn:' | sort -r | tail -n +6 | awk '{print \$1}' | xargs -r sudo k3s ctr images rm" 2>/dev/null || true
          done

          # Cleanup local docker
          docker image prune -f
          echo "✓ Cleanup complete"
