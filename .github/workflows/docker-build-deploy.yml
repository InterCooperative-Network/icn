# Full CI/CD workflow with self-hosted runner
# Copy this to .github/workflows/docker-build-deploy.yml after setting up the runner

name: Build and Deploy to K3s

on:
  push:
    branches: [main]
    paths:
      - 'icn/**'
      - 'apps/**'
      - 'Dockerfile'
      - '.github/workflows/docker-build-deploy.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to K3s after build'
        required: true
        default: 'true'
        type: boolean
  schedule:
    # Run cleanup weekly on Sunday at 3am UTC
    - cron: '0 3 * * 0'

env:
  IMAGE_NAME: icn
  IMAGE_TAG: ${{ github.sha }}
  K3S_CONTROL: 10.8.30.40
  K3S_REGISTRY: 10.8.30.40:30500
  # Increase rustc stack size to prevent compiler crashes (SIGSEGV) on large crates
  # Error suggested 536870912 (512MB) when 256MB was insufficient
  RUST_MIN_STACK: 536870912
  # Use clang instead of gcc to avoid GCC 13 ICE (internal compiler error)
  # when compiling aws-lc-sys crypto library
  CC: clang
  CXX: clang++
  # Limit parallel compilation jobs to avoid OOM on self-hosted runner (11GB RAM)
  CARGO_BUILD_JOBS: 2
  # Use mold linker on self-hosted runner (faster, less memory than GNU ld).
  # mold is installed in the "Install build tools" step.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  # Standard CI jobs run on GitHub-hosted runners
  test:
    name: Test
    runs-on: [self-hosted, homelab, k3s]
    # Skip test on scheduled runs (cleanup only)
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        uses: ./.github/actions/free-disk-space
        with:
          verbose: 'true'
          aggressive: 'true'

      - name: Install build tools (clang + mold linker)
        run: |
          PACKAGES=""
          if ! command -v clang &> /dev/null; then
            PACKAGES="$PACKAGES clang"
          fi
          if ! command -v mold &> /dev/null; then
            PACKAGES="$PACKAGES mold"
          fi
          if [ -n "$PACKAGES" ]; then
            sudo apt-get update && sudo apt-get install -y $PACKAGES
          fi
          echo "Compiler: $(clang --version | head -1)"
          echo "Linker: $(mold --version)"

      - uses: dtolnay/rust-toolchain@stable

      - name: Configure sccache
        run: |
          echo "RUSTC_WRAPPER=/usr/local/bin/sccache" >> $GITHUB_ENV
          echo "SCCACHE_DIR=/home/ubuntu/.cache/sccache" >> $GITHUB_ENV
          echo "SCCACHE_CACHE_SIZE=30G" >> $GITHUB_ENV
          sccache --start-server || true
          sccache --show-stats || true

      - name: Run tests
        run: cargo test --workspace
        working-directory: ./icn

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  # Build and deploy runs on self-hosted runner
  build-and-deploy:
    name: Build and Deploy
    needs: test
    runs-on: [self-hosted, homelab, k3s]
    # Skip build/deploy on scheduled runs (cleanup only)
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          echo "Building image ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -f Dockerfile .
          docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${{ env.IMAGE_NAME }}:latest
          echo "✓ Image built successfully"

      - name: Push to local registry
        run: |
          REGISTRY="${K3S_REGISTRY}"

          echo "Tagging for local registry..."
          docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${REGISTRY}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker tag ${{ env.IMAGE_NAME }}:latest ${REGISTRY}/${{ env.IMAGE_NAME }}:latest

          echo "Pushing to registry..."
          docker push ${REGISTRY}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${REGISTRY}/${{ env.IMAGE_NAME }}:latest

          echo "✓ Image pushed to local registry"

          # Pre-pull on all K3s nodes via SSH (ci-runner is not a K3s node)
          K3S_NODES="${K3S_CONTROL} 10.8.30.41 10.8.30.42"
          for NODE in $K3S_NODES; do
            echo "Pre-pulling on $NODE..."
            ssh -o BatchMode=yes ubuntu@$NODE "sudo k3s ctr images pull --plain-http ${REGISTRY}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" || {
              echo "  ⚠ Failed to pull on $NODE (node may be down, K3s will pull on deploy)"
            }
          done

          echo "✓ Image distributed to all nodes"

      - name: Deploy to K3s
        if: ${{ github.event.inputs.deploy != 'false' }}
        run: |
          echo "Deploying to K3s via SSH to ${K3S_CONTROL}..."
          REGISTRY="${K3S_REGISTRY}"
          IMAGE="${REGISTRY}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

          # All kubectl commands run on the K3s control node via SSH
          ssh -o BatchMode=yes ubuntu@${K3S_CONTROL} bash -s <<DEPLOY_EOF
            set -e
            IMAGE="${IMAGE}"

            # Update main daemon
            sudo kubectl -n icn set image deployment/icn-daemon icnd=\${IMAGE}

            # Update coop nodes
            for COOP in alpha beta gamma delta; do
              NS="icn-coop-\${COOP}"
              if sudo kubectl get namespace \${NS} &>/dev/null; then
                echo "Updating icn-\${COOP}..."
                sudo kubectl -n \${NS} set image deployment/icn-\${COOP} icnd=\${IMAGE} 2>/dev/null || true
              fi
            done

            # Restart deployments
            sudo kubectl -n icn rollout restart deployment/icn-daemon
            for COOP in alpha beta gamma delta; do
              NS="icn-coop-\${COOP}"
              if sudo kubectl get namespace \${NS} &>/dev/null; then
                sudo kubectl -n \${NS} rollout restart deployment/icn-\${COOP} 2>/dev/null || true
              fi
            done

            echo "✓ Deployment initiated"
          DEPLOY_EOF

      - name: Wait for rollout
        if: ${{ github.event.inputs.deploy != 'false' }}
        run: |
          echo "Waiting for rollout..."
          ssh -o BatchMode=yes ubuntu@${K3S_CONTROL} bash -s <<'ROLLOUT_EOF'
            set -e
            sudo kubectl -n icn rollout status deployment/icn-daemon --timeout=180s

            for COOP in alpha beta gamma delta; do
              NS="icn-coop-${COOP}"
              if sudo kubectl get namespace ${NS} &>/dev/null; then
                sudo kubectl -n ${NS} rollout status deployment/icn-${COOP} --timeout=120s 2>/dev/null || true
              fi
            done

            echo "✓ Rollout complete"
          ROLLOUT_EOF

      - name: Show deployment status
        if: always()
        run: |
          echo "=== Pod Status ==="
          ssh -o BatchMode=yes ubuntu@${K3S_CONTROL} "sudo kubectl get pods -A | grep icn" || true

          echo ""
          echo "=== Recent Events ==="
          ssh -o BatchMode=yes ubuntu@${K3S_CONTROL} "sudo kubectl -n icn get events --sort-by='.lastTimestamp' | tail -10" || true

      - name: Output summary
        run: |
          echo "## Deployment Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Pods" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ssh -o BatchMode=yes ubuntu@${K3S_CONTROL} "sudo kubectl get pods -A | grep icn" >> $GITHUB_STEP_SUMMARY || echo "No pods found" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # Cleanup old images (runs weekly)
  cleanup:
    name: Cleanup Old Images
    runs-on: [self-hosted, homelab, k3s]
    if: github.event_name == 'schedule'
    steps:
      - name: Remove old images on all nodes
        run: |
          echo "Cleaning up old images on all nodes..."
          K3S_NODES="${K3S_CONTROL} 10.8.30.41 10.8.30.42"

          # Cleanup on all K3s nodes via SSH
          for NODE in $K3S_NODES; do
            echo "Cleaning $NODE..."
            ssh -o BatchMode=yes ubuntu@$NODE "sudo k3s ctr images ls | grep 'docker.io/library/icn:' | sort -r | tail -n +6 | awk '{print \$1}' | xargs -r sudo k3s ctr images rm" 2>/dev/null || true
          done

          # Cleanup local docker on ci-runner
          docker image prune -f
          echo "✓ Cleanup complete"
