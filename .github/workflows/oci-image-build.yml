name: OCI Image Build

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "icn/**"
      - "Dockerfile"
      - ".github/workflows/oci-image-build.yml"
  pull_request:
    paths:
      - "apps/**"
      - "icn/**"
      - "Dockerfile"
      - ".github/workflows/oci-image-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oci-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build generic OCI image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: icn:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
