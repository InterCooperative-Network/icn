# Fake NYCN relationship expected-receipts contract — FICTIONAL, conformance
# fixture only.
#
# The receipt set the run must emit to be complete. run_level covers the dry-run
# and the human review; per_action covers each proposed action's outcome. A
# missing expected receipt means the run is incomplete. ArtifactReceipt (a
# verified-transfer proof) never satisfies ArtifactRegistrationReceipt, and no
# action-card write receipt appears (cards are derived read views). Commitment
# objects carry the generic GovernedObjectCreationReceipt (object_class is
# institution-declared opaque data); true follow-up objects carry
# FollowUpObjectCreationReceipt. Automatic blocks carry only their
# policy/consent block receipt.
meta:
  fictional: true

binding_id: rel_handoff_binding_001
dry_run_id: dryrun_rel_fake_001
review_id: review_rel_fake_001

expected_receipts:
  run_level:
