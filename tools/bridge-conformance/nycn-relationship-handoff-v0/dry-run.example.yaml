      - GovernedObjectCreationReceipt
    decision_required: true
  - action_id: act_005
    source_record_ref: rel_rec_fake_001
    field_path: relationship.fulfillment_request
    source_authority: counterparty_provided
    privacy_class: internal_only
    proposed_custody_target:
      kind: governed_object
    required_receipts:
      - BridgeImportReceipt
      - GovernedObjectCreationReceipt
    decision_required: true
  - action_id: act_006
    source_record_ref: rel_rec_fake_001
    field_path: relationship.fulfillment_preference
    source_authority: counterparty_provided
    privacy_class: internal_only
    proposed_custody_target:
      kind: governed_object
    required_receipts:
