    decision_required: true
  - action_id: act_003
    source_record_ref: rel_rec_fake_001
    field_path: relationship.public_recognition_preference
    source_authority: counterparty_provided
    privacy_class: internal_only
    proposed_custody_target:
      kind: artifact_registry
    required_receipts:
