# Fake NYCN relationship dry-run proposal — FICTIONAL, conformance fixture only.
#
# The preview a governed bridge WOULD propose over the fake relationship source
# shape. It performs no writes and reaches no external service. Every proposed
# action is decision-required and carries an opaque source-record reference —
# never a raw natural or PII-bearing key. Field values are NOT included.
#
# Records mirror the three fake source records: an approved relationship with a
# commitment and consented follow-up (001); a prospective relationship with
# recognition permission denied, an ambiguous commitment, and no follow-up
# consent (002); a declined/closed relationship kept internal only (003).
meta:
  fictional: true
  performs_writes: false

dry_run_id: dryrun_rel_fake_001
binding_id: rel_handoff_binding_001
source_system_id: src_sys_nycn_fake_relationship
source_shape_ref: shape_rel_fake_001
plan_hash: planhash_rel_fake_0001

proposed_actions:
  # --- record 001: recognition permission granted (consumed as the approval
  #     basis for the public artifact; the permission field itself is proposed
  #     only where it blocks — record 002) ---
  - action_id: act_001
    source_record_ref: rel_rec_fake_001
    field_path: relationship.public_listing_name
    source_authority: counterparty_provided
    privacy_class: public_after_approval
    proposed_custody_target:
      kind: artifact_registry
    required_receipts:
      - BridgeImportReceipt
      - ArtifactRegistrationReceipt
    decision_required: true
  - action_id: act_002
    source_record_ref: rel_rec_fake_001
    field_path: relationship.public_listing_category
    source_authority: counterparty_provided
