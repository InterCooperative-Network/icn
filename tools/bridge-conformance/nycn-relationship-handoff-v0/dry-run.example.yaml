      - ArtifactRegistrationReceipt
    decision_required: true
  - action_id: act_004
    source_record_ref: rel_rec_fake_001
    field_path: relationship.commitment_level_label
    source_authority: institution_derived
    privacy_class: internal_only
    proposed_custody_target:
      kind: governed_object
    required_receipts:
