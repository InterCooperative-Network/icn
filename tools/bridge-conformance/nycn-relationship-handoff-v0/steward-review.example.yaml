#
# The human review gate over the dry-run proposal. No real reviewer, no real
# data, no writes. The reviewer is bound by a VERIFIABLE authority reference;
# the display role is for legibility only and is never sufficient on its own.
# Every proposed action gets exactly one decision, keyed by
# (source_record_ref, field_path). reviewed_plan_hash must equal the dry-run
# plan_hash. Automatic blocks (denied recognition permission, no-consent
# follow-up) are NOT human review decisions and carry no review receipt.
