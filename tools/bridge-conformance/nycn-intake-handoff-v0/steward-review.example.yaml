# Fake NYCN intake steward review — FICTIONAL, conformance fixture only.
#
# The human review gate over the dry-run proposal. No real reviewer, no real
# data, no writes. The reviewer is bound by a VERIFIABLE authority reference; the
# display role is for legibility only and is never sufficient on its own. NYCN's
# airlock has only a role-only reviewer today (see the handoff map's reviewer
# authority gap). Every proposed action gets exactly one decision, keyed by
# (source_record_ref, field_path). reviewed_plan_hash must equal the dry-run
# plan_hash. The no-consent follow-up (record 002) is an AUTOMATIC block — no
# human review is implied for it.
meta:
  fictional: true

review_id: review_nycn_fake_001
dry_run_id: dryrun_nycn_fake_001
binding_id: nycn_handoff_binding_001
reviewer_authority_ref: authref_nycn_fake_did_sig_001   # verifiable; display role is not enough
reviewer_display_role: summit_data_steward
reviewed_plan_hash: planhash_nycn_fake_0001

decisions:
