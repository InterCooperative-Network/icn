# =============================================================================
# REFACTORING PRIORITY
# =============================================================================

[refactoring_priority]
description = "Order of extraction work"

[[refactoring_priority.phases]]
phase = 1
name = "Extract Trust"
crates = ["icn-trust"]
notes = """
Move trust computation to icn-app-trust.
Add PolicyOracle to icn-kernel-api.
Update icn-gossip and icn-net to use PolicyOracle.
"""

[[refactoring_priority.phases]]
phase = 2
name = "Extract Ledger"
crates = ["icn-ledger"]
notes = """
Move ledger to icn-app-ledger.
Generalize icn-store for namespaced storage.
Balances become projections.
"""

[[refactoring_priority.phases]]
phase = 3
name = "Extract Governance"
crates = ["icn-governance"]
notes = """
Move governance to icn-app-governance.
Remove governance actors from icn-core.
"""

[[refactoring_priority.phases]]
phase = 4
name = "Merge Membership"
crates = ["icn-coop", "icn-community", "icn-entity"]
notes = """
Merge into single icn-app-membership.
"""

[[refactoring_priority.phases]]
phase = 5
name = "Extract Verification Apps"
crates = ["icn-steward", "icn-zkp"]
notes = """
Move to icn-app-steward and icn-app-zkp.
"""

[[refactoring_priority.phases]]
phase = 6
name = "Crate Consolidation"
crates = ["icn-net", "icn-gossip", "icn-store", "icn-snapshot"]
notes = """
Merge into icn-network and icn-storage.
Target: 27 crates → ~12 crates.
"""
