[crates.icn-trust]
description = "Trust graph computation"
status = "infected"
infection_severity = "high"
infection_notes = """
Trust computation should be an app implementing PolicyOracle, not a kernel
crate. Currently, trust types are imported directly by icn-gossip, icn-net,
icn-ledger, and icn-governance.

The internal implementation is relatively clean (uses Store trait), but
its position as a kernel crate causes cascading infections.
"""

[[crates.icn-trust.exports]]
name = "TrustGraph"
kind = "struct"
public_methods = ["new", "get_score", "add_attestation", "compute"]
notes = "INFECTED: Should become trust app"

[[crates.icn-trust.exports]]
name = "TrustScore"
kind = "struct"
public_methods = ["new", "value", "class"]
notes = "INFECTED: Domain type, should be app"

[[crates.icn-trust.exports]]
name = "TrustClass"
kind = "enum"
variants = ["Isolated", "Known", "Partner", "Federated"]
notes = "INFECTED: Domain type, should be app"

[[crates.icn-trust.exports]]
