# ICN Kernel Surface Inventory
#
# This file lists every public API exposed by kernel crates and tracks
# their "infection" status - whether they contain domain-specific logic
# that should be extracted to apps.
#
# Status values:
#   clean          - Pure infrastructure, no domain coupling
#   infected       - Contains domain logic that should be extracted
#   needs-review   - Unclear, requires analysis
#
# Update this file when kernel APIs change.
# Every PR touching kernel code must check this inventory.

[metadata]
version = "0.1.0"
last_updated = "2025-01-25"
total_crates = 27
clean_crates = 8
infected_crates = 11
needs_review_crates = 8

# =============================================================================
# CORE INFRASTRUCTURE CRATES
# =============================================================================

[crates.icn-core]
description = "Actor runtime and supervisor"
status = "infected"
infection_severity = "high"
infection_notes = """
Runtime is entangled with governance policies. The GovernanceActor,
ResourceAccessEnforcerActor, and upgrade coordination leak policy
concerns into the base runtime. These should be apps, not kernel.
"""

[[crates.icn-core.exports]]
name = "Runtime"
kind = "struct"
public_methods = ["new", "start", "stop", "shutdown"]
notes = "Core runtime - should stay kernel"

[[crates.icn-core.exports]]
name = "Supervisor"
kind = "struct"
public_methods = ["new", "spawn", "stop", "send"]
notes = "Actor supervision - should stay kernel"

[[crates.icn-core.exports]]
name = "EventBus"
kind = "struct"
public_methods = ["subscribe", "publish", "unsubscribe"]
notes = "Event routing - should stay kernel"

[[crates.icn-core.exports]]
