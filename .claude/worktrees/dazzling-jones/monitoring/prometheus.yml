# Prometheus configuration for ICN internal testing

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'testing'
    cluster: 'icn-internal'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Load alert rules
rule_files:
  - '/etc/prometheus/alert_rules.yml'

# Scrape configurations
scrape_configs:
  # ICN nodes
  - job_name: 'icn-nodes'
    static_configs:
      - targets:
          - 'node1:9100'
          - 'node2:9100'
          - 'node3:9100'
          - 'node4:9100'
        labels:
          cluster: 'icn-test'
    relabel_configs:
      # Extract node name from hostname
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):.*'
        replacement: '$1'

      # Add node role label (honest vs byzantine)
      - source_labels: [instance]
        target_label: node_role
        regex: 'node[1-3]'
        replacement: 'honest'
      - source_labels: [instance]
        target_label: node_role
        regex: 'node4'
        replacement: 'byzantine'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
