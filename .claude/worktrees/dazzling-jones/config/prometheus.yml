# Prometheus Configuration for ICN
# This configuration scrapes metrics from ICN nodes.
#
# Usage:
#   prometheus --config.file=config/prometheus.yml
#
# Or with Docker:
#   docker run -p 9090:9090 -v $(pwd)/config:/etc/prometheus \
#     prom/prometheus --config.file=/etc/prometheus/prometheus.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'icn-local'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - 'alertmanager:9093'

# Load rules once and periodically evaluate them
# rule_files:
#   - "alerts/*.yml"

scrape_configs:
  # ICN Alpha Node (local demo)
  - job_name: 'icn-alpha'
    static_configs:
      - targets: ['localhost:9100']
        labels:
          node: 'alpha'
          environment: 'dev'

  # ICN Beta Node (local demo)
  - job_name: 'icn-beta'
    static_configs:
      - targets: ['localhost:9101']
        labels:
          node: 'beta'
          environment: 'dev'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

