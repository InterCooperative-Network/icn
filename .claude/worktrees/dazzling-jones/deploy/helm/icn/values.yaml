# ICN Helm Chart Values
#
# IMPORTANT: Before deploying to production, override ALL secrets!
# Use --set or a separate values-secrets.yaml file (not committed to git)
#
# Example:
#   helm install icn . --set icn.secrets.jwtSecret="$(openssl rand -base64 32)"
#   helm install icn . -f values.yaml -f values-secrets.yaml

global:
  domain: "example.com"

icn:
  replicaCount: 1
  image:
    repository: icn/icnd
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    gateway:
      port: 8000
    p2p:
      type: LoadBalancer
      port: 3000
    metrics:
      port: 9090

  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    host: "api.example.com"

  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

  persistence:
    enabled: true
    size: 10Gi

  env:
    LOG_LEVEL: "info"
    RUST_LOG: "icn=info"

  # SECRETS - MUST be overridden in production!
  # Generate with: openssl rand -base64 32
  secrets:
    # WARNING: This is a placeholder. Override with --set or values-secrets.yaml
    jwtSecret: ""

prometheus:
  enabled: true
  retention: "30d"
  persistence:
    size: 20Gi

grafana:
  enabled: true
  # WARNING: Change this password in production!
  # Override with: --set grafana.adminPassword="$(openssl rand -base64 16)"
  adminPassword: ""
  persistence:
    size: 5Gi

dashboard:
  enabled: true
  host: "dashboard.example.com"

apiDocs:
  enabled: true
  host: "docs.example.com"
