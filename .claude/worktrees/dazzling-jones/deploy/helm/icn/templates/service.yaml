apiVersion: v1
kind: Service
metadata:
  name: {{ include "icn.fullname" . }}-gateway
  labels:
    {{- include "icn.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.icn.service.gateway.port }}
    targetPort: gateway
    name: http
  selector:
    {{- include "icn.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "icn.fullname" . }}-p2p
  labels:
    {{- include "icn.labels" . | nindent 4 }}
spec:
  type: {{ .Values.icn.service.p2p.type }}
  ports:
  - port: {{ .Values.icn.service.p2p.port }}
    targetPort: p2p
    protocol: UDP
    name: quic
  selector:
    {{- include "icn.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "icn.fullname" . }}-metrics
  labels:
    {{- include "icn.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.icn.service.metrics.port }}
    targetPort: metrics
    name: metrics
  selector:
    {{- include "icn.selectorLabels" . | nindent 4 }}
