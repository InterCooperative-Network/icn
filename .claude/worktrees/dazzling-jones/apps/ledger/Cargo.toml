[package]
name = "icn-ledger-app"
version = "0.1.0"
edition = "2021"
description = "Ledger app - provides ledger-based policy decisions for the ICN kernel"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
utoipa = ["dep:utoipa"]

[dependencies]
# Kernel API for PolicyOracle trait and types
icn-kernel-api = { path = "../../icn/crates/icn-kernel-api" }

# Internal ledger implementation (not exposed to kernel)
icn-ledger = { path = "../../icn/crates/icn-ledger" }

# Identity types (for Did conversion)
icn-identity = { path = "../../icn/crates/icn-identity" }

# Storage
icn-store = { path = "../../icn/crates/icn-store" }

# Contract execution (for ContractRuntime, ContractActor, CharterValidator)
icn-ccl = { path = "../../icn/crates/icn-ccl" }

# Observability (for treasury validation metrics)
icn-obs = { path = "../../icn/crates/icn-obs" }

# Sync primitives (for PolicyOracle sync requirement)
parking_lot = "0.12"
tokio = { version = "1", features = ["sync", "rt", "time"] }

# Serialization (for store implementations)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# Sled database (for store implementations)
sled = "0.34"

# Time utilities (for budgets, escrow, recurring payments)
icn-time = { path = "../../icn/crates/icn-time" }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"

# OpenAPI documentation (optional)
utoipa = { version = "5", optional = true }

# Metrics
metrics = "0.24"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
