name: Bug Report
description: Report a bug
labels: ["bug"]
body:
  - type: dropdown
    id: epic
    attributes:
      label: Epic
      description: Which epic does this bug belong to?
      options:
        - "epic:kernel-separation"
        - "epic:arch-invariants"
        - "epic:trust-hardening"
        - "epic:service-discovery"
        - "epic:commons-compute"
        - "epic:kernel-perf"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How to trigger this bug
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: false

  - type: textarea
    id: depends
    attributes:
      label: Depends on
      description: "List blocking issues as checklist: - [ ] #NNN"
    validations:
      required: false
