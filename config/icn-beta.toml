# ICN Beta Node Configuration
# This is node 2 of 2 in the local two-node demo.
# Use with: icnd --config config/icn-beta.toml

data_dir = "/tmp/icn-beta"

[network]
listen_addr = "0.0.0.0:7778"
rpc_port = 5602
mdns_enabled = true
bootstrap_peers = []

[observability]
metrics_port = 9101
health_port = 8081
log_level = "info"

[rate_limiting]
enabled = true
refill_interval_ms = 100

[rate_limiting.isolated]
max_messages_per_second = 10
burst_capacity = 2

[rate_limiting.known]
max_messages_per_second = 50
burst_capacity = 10

[rate_limiting.partner]
max_messages_per_second = 100
burst_capacity = 20

[rate_limiting.federated]
max_messages_per_second = 200
burst_capacity = 50

[rate_limiting.fallback]
max_messages_per_second = 100
burst_capacity = 20

[topology]
region = "local-dev"
cluster_id = "laptop-1"
role = "edge"

[topology.neighbor_limits]
max_local_cluster = 10
max_regional = 10
max_backbone = 5
max_trusted = 20

[topology.fanout]
local_cluster = 8
regional = 6
global = 4
