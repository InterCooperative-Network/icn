[workspace]
resolver = "2"
members = [
    "crates/icn-core",
    "crates/icn-identity",
    "crates/icn-trust",
    "crates/icn-net",
    "crates/icn-gossip",
    "crates/icn-ledger",
    "crates/icn-ccl",
    "crates/icn-store",
    "crates/icn-rpc",
    "crates/icn-obs",
    "crates/icn-snapshot",
    "crates/icn-testkit",
    "bins/icnd",
    "bins/icnctl",
    "bins/icn-console",
    "crates/icn-gateway",
    "crates/icn-governance",
    "crates/icn-compute",
    "crates/icn-security",
    "crates/icn-time",
    "crates/icn-privacy",
    "crates/icn-federation",
    "crates/icn-crypto-pq",
    "crates/icn-steward",
    "crates/icn-zkp", "crates/icn-cooperative", "crates/icn-community", "crates/icn-coop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/icn"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "io-util", "fs", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Networking & Transport
quinn = "0.11"
rustls = "0.23"
tokio-rustls = "0.26"
hyper = { version = "1.5", features = ["full"] }

# RPC
tonic = "0.14"
prost = "0.14"

# Discovery
mdns-sd = "0.11"

# Identity & Crypto
ed25519-dalek = { version = "2.1", features = ["rand_core", "batch"] }
x25519-dalek = "2.0"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.8"
zeroize = "1.7"
rcgen = "0.13"
sha2 = "0.10"
pem = "3.0"

# Storage
sled = "0.34"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = { version = "2.0", features = ["serde"] }
toml = "0.8"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.17"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Utilities
bytes = "1.5"
futures = "0.3"
lru = "0.12"

# Internal workspace crates
icn-core = { path = "crates/icn-core" }
icn-identity = { path = "crates/icn-identity" }
icn-trust = { path = "crates/icn-trust" }
icn-net = { path = "crates/icn-net" }
icn-gossip = { path = "crates/icn-gossip" }
icn-ledger = { path = "crates/icn-ledger" }
icn-ccl = { path = "crates/icn-ccl" }
icn-store = { path = "crates/icn-store" }
icn-rpc = { path = "crates/icn-rpc" }
icn-obs = { path = "crates/icn-obs" }
icn-snapshot = { path = "crates/icn-snapshot" }
icn-testkit = { path = "crates/icn-testkit" }
icn-gateway = { path = "crates/icn-gateway" }
icn-governance = { path = "crates/icn-governance" }
icn-compute = { path = "crates/icn-compute" }
icn-security = { path = "crates/icn-security" }
icn-time = { path = "crates/icn-time" }
icn-privacy = { path = "crates/icn-privacy" }
icn-federation = { path = "crates/icn-federation" }
icn-crypto-pq = { path = "crates/icn-crypto-pq" }
icn-steward = { path = "crates/icn-steward" }
icn-zkp = { path = "crates/icn-zkp" }

[workspace.lints.clippy]
# Error handling - warn for now, will be upgraded to deny after cleanup
unwrap_used = "warn"
expect_used = "warn"
# Allow in tests
unwrap_in_result = "allow"
