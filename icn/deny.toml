# cargo-deny configuration for ICN workspace
# Run with: cargo deny check
# Install: cargo install cargo-deny

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # These are "unmaintained" warnings from transitive dependencies, not
    # security vulnerabilities. They are tracked but don't block CI.

    # fxhash is unmaintained but only used transitively by sled.
    # sled is in maintenance mode and fxhash has no known vulnerabilities.
    # We'll migrate away from sled in a future release.
    "RUSTSEC-2025-0057",  # fxhash unmaintained

    # instant is unmaintained, used transitively by sled via parking_lot.
    # Recommended replacement is web-time, but sled needs to update first.
    "RUSTSEC-2024-0384",  # instant unmaintained

    # paste is no longer maintained but is a stable macro utility with no
    # known vulnerabilities. Used transitively by pqcrypto-mldsa (NIST PQ crypto).
    # The maintainer archived the repo, but paste v1.x is widely used and stable.
    "RUSTSEC-2024-0436",  # paste unmaintained (transitive via pqcrypto-mldsa)

    # atomic-polyfill is deprecated, used transitively by postcard via heapless.
    # Recommended replacement is portable-atomic. Tracking in #535 (postcard migration).
    # Will be resolved when heapless updates or we use postcard without heapless feature.
    "RUSTSEC-2023-0089",  # atomic-polyfill deprecated

    # bincode is unmaintained. The team considers v1.3.3 stable with no updates needed.
    # Used as dev dependency in icn-kernel-api for testing serialization.
    # Migration to postcard or bitcode is tracked for future work.
    "RUSTSEC-2025-0141",  # bincode unmaintained

    # rand 0.8.5 is pulled in transitively by age v0.11.2 (used in icn-identity
    # for Age-encrypted keystore). The advisory requires >=0.9.3 but age hasn't
    # updated yet. The vulnerability requires a custom logger that calls rand::rng()
    # during logging — ICN does not implement a custom logger in this pattern.
    # Track: watch for age 0.12.x which should move to rand 0.9.x.
    "RUSTSEC-2026-0097",  # rand unsound with custom logger (transitive via age)

    # rustls-webpki 0.103.10 — two name-constraint advisories filed 2026-04-14.
    # Both are in the same crate/version and have the same fix (>=0.103.12).
    # Pulled in transitively by reqwest via rustls-platform-verifier.
    # Upgrade is pending reqwest/rustls-platform-verifier releasing a compatible
    # update. Neither advisory is exploitable in ICN's direct usage pattern
    # (no URI name constraints in ICN's TLS setup; no wildcard cert validation).
    "RUSTSEC-2026-0098",  # rustls-webpki URI name constraints (transitive via reqwest)
    "RUSTSEC-2026-0099",  # rustls-webpki wildcard name constraints (transitive via reqwest)

    # The pqcrypto-* crates (NIST PQ crypto: ML-DSA signatures, ML-KEM KEM) were
    # all flagged unmaintained on 2026-06-04 because upstream PQClean is being
    # archived (July 2026, see PQClean/PQClean#604). These are "unmaintained"
    # advisories, not exploitable vulnerabilities, and the advisories state that
    # no safe upgrade is available. ICN depends on them via icn-crypto →
    # icn-crypto-pq. Migrating to a maintained PQ provider (RustCrypto ml-dsa/ml-kem
    # or aws-lc-rs) is tracked as future work; until then these are ignored so the
    # unmaintained-no-fix advisories don't block CI.
    "RUSTSEC-2026-0161",  # pqcrypto-mlkem unmaintained (PQClean archived)
    "RUSTSEC-2026-0162",  # pqcrypto-traits unmaintained (PQClean archived)
    "RUSTSEC-2026-0163",  # pqcrypto-internals unmaintained (PQClean archived)
    "RUSTSEC-2026-0166",  # pqcrypto-mldsa unmaintained (PQClean archived)

    # proc-macro-error2 is unmaintained, pulled in transitively via
    # i18n-embed-fl ← age ← icn-identity (Age-encrypted keystore). This is an
    # "unmaintained" advisory, not an exploitable vulnerability. Current Cargo.lock
    # pins i18n-embed-fl 0.9.4 / age 0.11.2; upgrading does not help because the
    # latest releases (i18n-embed-fl 0.10.0 / age 0.11.3) still depend on
    # proc-macro-error2. Revisit when `age` drops the dependency.
    "RUSTSEC-2026-0173",  # proc-macro-error2 unmaintained (transitive via i18n-embed-fl ← age)
]

[licenses]
# We allow permissive and copyleft licenses compatible with cooperative software
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "OpenSSL",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# All ICN crates now have license = "Apache-2.0" in their Cargo.toml files

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# Deny specific crates
deny = [
    # Add crates to ban here
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
