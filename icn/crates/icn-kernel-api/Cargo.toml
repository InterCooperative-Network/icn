[package]
name = "icn-kernel-api"
version = "0.1.0"
edition = "2021"
description = "ICN Kernel API - Trait definitions for all kernel primitives"
license = "MIT OR Apache-2.0"
repository = "https://github.com/InterCooperative-Network/icn"
readme = "README.md"
keywords = ["icn", "kernel", "api", "traits"]
categories = ["api-bindings"]

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
arc-swap = "1.8"
parking_lot = "0.12"
ordered-float = { version = "5.1", features = ["serde"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
