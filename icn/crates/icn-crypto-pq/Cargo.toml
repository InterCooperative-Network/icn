[package]
name = "icn-crypto-pq"
version = "0.1.0"
edition = "2021"
description = "Post-quantum hybrid cryptography for ICN SDIS integration"
license = "MIT OR Apache-2.0"

[dependencies]
# Classical cryptography
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2.0", features = ["serde", "static_secrets"] }
curve25519-dalek = "4.1"

# Post-quantum cryptography (NIST FIPS standards)
# Note: Using pqcrypto crate which wraps reference implementations
pqcrypto-dilithium = "0.5"  # ML-DSA (FIPS 204)
pqcrypto-kyber = "0.8"       # ML-KEM (FIPS 203)
pqcrypto-traits = "0.3"

# Threshold cryptography
# vsss-rs = "4.0"            # Verifiable secret sharing (add when needed)
# frost-ed25519 = "2.0"      # FROST threshold signatures (add when needed)

# Key derivation and hashing
sha3 = "0.10"
hkdf = "0.12"
hmac = "0.12"

# Randomness
rand = "0.8"
rand_core = "0.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "3.0"

# Security
zeroize = { version = "1.7", features = ["derive"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
criterion = "0.5"
hex = "0.4"
serde_json = "1.0"

# Uncomment when benchmarks are implemented
# [[bench]]
# name = "hybrid_bench"
# harness = false

[features]
default = []
# Enable threshold cryptography (adds dependencies)
threshold = []
# Enable blind signatures
blind = []
