[package]
name = "icn-boundary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic WASM/host boundary types for governance-grade execution envelopes"

[features]
default = ["std"]
std = ["serde/std"]

[dependencies]
# Explicit versions (not `workspace = true`) so `default-features = false` is never
# merged away from workspace `[workspace.dependencies]` postcard/serde entries,
# which would re-enable `postcard`/`serde` defaults and break `#![no_std]` WASM guests.
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }

[lints]
workspace = true
