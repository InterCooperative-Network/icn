[package]
name = "icn-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Enable sled storage backend tests
sled-storage = []


[dependencies]
# Optional persistent storage
sled = { workspace = true }
# Web framework
actix = "0.13"
actix-web = "4"
actix-cors = "0.7"
actix-web-prom = "0.10"
actix-web-actors = "4"
actix-web-httpauth = "0.8"
actix-files = "0.6"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2.0", features = ["serde"] }
serde_bytes = "0.11"

# Logging and distributed tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-actix-web = "0.7"

# Error handling
anyhow = "1"
thiserror = "2"

# JWT tokens
jsonwebtoken = "9"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Time
chrono = "0.4"

# Cryptography
hex = "0.4"
rand = "0.8"
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"

# ICN dependencies
icn-identity = { path = "../icn-identity" }
icn-time = { path = "../icn-time" }
icn-ledger = { path = "../icn-ledger" }
icn-store = { path = "../icn-store", features = ["openapi"] }
icn-rpc = { path = "../icn-rpc" }
icn-obs = { path = "../icn-obs" }
icn-governance = { path = "../icn-governance" }
icn-compute = { path = "../icn-compute" }
icn-federation = { path = "../icn-federation" }
icn-trust = { path = "../icn-trust" }
icn-ccl = { path = "../icn-ccl" }
icn-zkp = { path = "../icn-zkp" }
icn-steward = { path = "../icn-steward" }
icn-crypto-pq = { path = "../icn-crypto-pq" }
icn-coop = { path = "../icn-coop" }
icn-cooperative = { path = "../icn-cooperative" }
icn-community = { path = "../icn-community" }

# Caching
lru = "0.12"
dashmap = "6.0"

# Metrics
metrics = "0.24"

# OpenAPI documentation
utoipa = { version = "4", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "6", features = ["actix-web"] }

# HTTP client for FCM
reqwest = { version = "0.11", features = ["json"] }

# Email/SMTP
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }

[dev-dependencies]
reqwest = "0.11"
tempfile = "3"
criterion = { version = "0.5", features = ["async_tokio"] }
prometheus = "0.14"

[[bench]]
name = "commons_bench"
harness = false

[lints]
workspace = true
