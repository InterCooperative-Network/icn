[package]
name = "icn-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
sled-storage = ["sled"]

[dependencies]
# Optional persistent storage
sled = { workspace = true, optional = true }
# Web framework
actix = "0.13"
actix-web = "4"
actix-cors = "0.7"
actix-web-actors = "4"
actix-web-httpauth = "0.8"
actix-files = "0.6"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
serde_bytes = "0.11"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# JWT tokens
jsonwebtoken = "9"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Time
chrono = "0.4"

# Cryptography
hex = "0.4"
rand = "0.8"
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"

# ICN dependencies
icn-identity = { path = "../icn-identity" }
icn-ledger = { path = "../icn-ledger" }
icn-store = { path = "../icn-store" }
icn-rpc = { path = "../icn-rpc" }
icn-obs = { path = "../icn-obs" }
icn-governance = { path = "../icn-governance" }
icn-compute = { path = "../icn-compute" }
icn-federation = { path = "../icn-federation" }
icn-trust = { path = "../icn-trust" }
icn-zkp = { path = "../icn-zkp" }
icn-steward = { path = "../icn-steward" }
icn-crypto-pq = { path = "../icn-crypto-pq" }

# Caching
lru = "0.12"
dashmap = "6.0"

# Metrics
metrics = "0.22"

[dev-dependencies]
reqwest = "0.11"
tempfile = "3"
