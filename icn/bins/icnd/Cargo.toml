[package]
name = "icnd"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "icnd"
path = "src/main.rs"

[features]
default = []
# WASM execution via wasmtime
wasm = ["icn-core/wasm"]
# HSM support via PKCS#11 (requires cryptoki system library)
hsm = ["icn-identity/hsm"]
# TPM 2.0 support (experimental, requires tss2 system libraries)
tpm-experimental = ["icn-identity/tpm-experimental"]

[dependencies]
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
clap.workspace = true
rpassword = "7.3"
rustls.workspace = true
zeroize.workspace = true

# ICN crates
icn-core.workspace = true
icn-identity.workspace = true
icn-kernel-api.workspace = true
icn-trust.workspace = true
icn-net.workspace = true
icn-gossip.workspace = true
icn-ledger.workspace = true
icn-ccl.workspace = true
icn-store.workspace = true
icn-rpc.workspace = true
icn-obs.workspace = true

# App crates (domain logic - lives outside kernel)
icn-trust-app = { path = "../../../apps/trust" }
icn-governance-app = { path = "../../../apps/governance" }
icn-governance-actor = { path = "../../apps/governance" }
icn-ledger-app = { path = "../../../apps/ledger" }
icn-charter-app = { path = "../../apps/charter" }

# Needed for parameter store construction in daemon
sled.workspace = true
icn-governance.workspace = true

[lints]
workspace = true
