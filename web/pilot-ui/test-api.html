<!DOCTYPE html>
<html>
<head>
    <title>ICN API Test</title>
</head>
<body>
    <h1>ICN API Direct Test</h1>
    <button onclick="testAPI()">Test API</button>
    <pre id="output"></pre>

    <script>
    const TOKEN = 'PASTE-DEV-TOKEN-HERE';
    
    async function testAPI() {
        const output = document.getElementById('output');
        output.textContent = 'Testing...\n';
        
        try {
            // Test 1: Health
            output.textContent += '\n1. Testing health endpoint...\n';
            const health = await fetch('http://localhost:8080/v1/health');
            output.textContent += `Status: ${health.status}\n`;
            output.textContent += `Response: ${await health.text()}\n`;
            
            // Test 2: Cooperative
            output.textContent += '\n2. Testing cooperative endpoint...\n';
            const coop = await fetch('http://localhost:8080/v1/coops/rochester-tool-library', {
                headers: { 'Authorization': `Bearer ${TOKEN}` }
            });
            output.textContent += `Status: ${coop.status}\n`;
            output.textContent += `Response: ${await coop.text()}\n`;
            
            // Test 3: Balance
            output.textContent += '\n3. Testing balance endpoint...\n';
            const balance = await fetch('http://localhost:8080/v1/ledger/rochester-tool-library/balance/did:icn:zBFnhJhgvRjgukhQmkq9ddBz5wiEt32ptkQkBDjWx6uPh', {
                headers: { 'Authorization': `Bearer ${TOKEN}` }
            });
            output.textContent += `Status: ${balance.status}\n`;
            output.textContent += `Response: ${await balance.text()}\n`;
            
            output.textContent += '\n✅ ALL TESTS PASSED!\n';
            
        } catch (error) {
            output.textContent += `\n❌ ERROR: ${error.message}\n`;
            output.textContent += `Stack: ${error.stack}\n`;
        }
    }
    </script>
</body>
</html>
