
# ICN Pilot Deployment Stack
#
# This docker-compose file provides a complete ICN deployment including:
# - ICN daemon (icnd) with gateway enabled
# - Prometheus for metrics collection
# - Grafana for monitoring dashboards
# - Nginx to serve the pilot web UI
#
# Usage:
#   1. Copy .env.example to .env and configure
#   2. Run: docker-compose up -d
#   3. Access:
#      - Web UI: http://localhost:3000
#      - Gateway API: http://localhost:8080
#      - Grafana: http://localhost:3001 ( default creds - change for prod)
#      - Prometheus: http://localhost:9091

services:
  # ICN Daemon
  icnd:
    build:
      context: ../icn
      dockerfile: ../deploy/Dockerfile.icnd
    container_name: icn-daemon
    ports:
      - "8080:8080"   # Gateway API
      - "7777:7777"   # QUIC/P2P
      - "9090:9090"   # Prometheus metrics
      - "5601:5601"   # gRPC
    volumes:
      - icn-data:/root/.icn
      - ./config/icn.toml:/root/.icn/icn.toml:ro
    environment:
      - ICN_GATEWAY_JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - RUST_LOG=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: icn-prometheus
    ports:
      - "9093:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # Grafana for dashboards
  grafana:
    image: grafana/grafana-oss:latest
    container_name: icn-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/icn.json:ro
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    depends_on:
      - prometheus

  # Web UI (nginx serving static files)
  web-ui:
    image: nginx:alpine
    container_name: icn-web-ui
    ports:
      - "3000:80"
    volumes:
      - ../web/pilot-ui:/usr/share/nginx/html:ro
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - icnd

volumes:
  icn-data:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: icn-network
