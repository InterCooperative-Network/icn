version: '3.8'

services:
  node-a:
    image: icn:latest
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.icnd
    container_name: icn-devnet-node-a
    hostname: node-a
    environment:
      - ICN_NODE_NAME=node-a
      - ICN_DATA_DIR=/data/node-a
      - ICN_GATEWAY_PORT=8080
      - ICN_P2P_PORT=9000
      - ICN_METRICS_PORT=9100
      - ICN_BOOTSTRAP_PEERS=
      - ICN_KEYSTORE_PASSPHRASE=devnet-insecure
      - ICN_GENESIS_FILE=/devnet/genesis.json
      - RUST_LOG=info,icn_core=debug,icn_gossip=debug,icn_net=debug
    ports:
      - "8080:8080"   # Gateway
      - "9000:9000"   # P2P
      - "9100:9100"   # Prometheus metrics
    volumes:
      - node-a-data:/data/node-a
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ./genesis.json:/devnet/genesis.json:ro
    networks:
      - icn-devnet
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    entrypoint: ["/usr/local/bin/entrypoint.sh"]

  node-b:
    image: icn:latest
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.icnd
    container_name: icn-devnet-node-b
    hostname: node-b
    environment:
      - ICN_NODE_NAME=node-b
      - ICN_DATA_DIR=/data/node-b
      - ICN_GATEWAY_PORT=8080
      - ICN_P2P_PORT=9000
      - ICN_METRICS_PORT=9100
      - ICN_BOOTSTRAP_PEERS=icn://node-a:9000
      - ICN_KEYSTORE_PASSPHRASE=devnet-insecure
      - ICN_GENESIS_FILE=/devnet/genesis.json
      - RUST_LOG=info,icn_core=debug,icn_gossip=debug,icn_net=debug
    ports:
      - "8081:8080"   # Gateway (external 8081 → internal 8080)
      - "9001:9000"   # P2P
      - "9101:9100"   # Prometheus metrics
    volumes:
      - node-b-data:/data/node-b
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ./genesis.json:/devnet/genesis.json:ro
    networks:
      - icn-devnet
    depends_on:
      node-a:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    entrypoint: ["/usr/local/bin/entrypoint.sh"]

  node-c:
    image: icn:latest
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.icnd
    container_name: icn-devnet-node-c
    hostname: node-c
    environment:
      - ICN_NODE_NAME=node-c
      - ICN_DATA_DIR=/data/node-c
      - ICN_GATEWAY_PORT=8080
      - ICN_P2P_PORT=9000
      - ICN_METRICS_PORT=9100
      - ICN_BOOTSTRAP_PEERS=icn://node-a:9000,icn://node-b:9000
      - ICN_KEYSTORE_PASSPHRASE=devnet-insecure
      - ICN_GENESIS_FILE=/devnet/genesis.json
      - RUST_LOG=info,icn_core=debug,icn_gossip=debug,icn_net=debug
    ports:
      - "8082:8080"   # Gateway (external 8082 → internal 8080)
      - "9002:9000"   # P2P
      - "9102:9100"   # Prometheus metrics
    volumes:
      - node-c-data:/data/node-c
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ./genesis.json:/devnet/genesis.json:ro
    networks:
      - icn-devnet
    depends_on:
      node-a:
        condition: service_healthy
      node-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    entrypoint: ["/usr/local/bin/entrypoint.sh"]

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: icn-devnet-prometheus
    hostname: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - icn-devnet
    depends_on:
      node-a:
        condition: service_healthy
      node-b:
        condition: service_healthy
      node-c:
        condition: service_healthy

  grafana:
    image: grafana/grafana:10.4.0
    container_name: icn-devnet-grafana
    hostname: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=devnet
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - icn-devnet
    depends_on:
      - prometheus

volumes:
  node-a-data:
  node-b-data:
  node-c-data:
  prometheus-data:
  grafana-data:

networks:
  icn-devnet:
    driver: bridge
