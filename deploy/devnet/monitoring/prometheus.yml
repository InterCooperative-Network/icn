global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: devnet

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: icn-nodes
    static_configs:
      - targets:
          - node-a:9100
          - node-b:9100
          - node-c:9100
        labels:
          environment: devnet
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: node
        replacement: '$1'
