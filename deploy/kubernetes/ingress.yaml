apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: icn-ingress
  namespace: icn
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/websocket-services: icn-gateway
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  tls:
  - hosts:
    - api.your-coop.org
    - dashboard.your-coop.org
    secretName: icn-tls
  rules:
  - host: api.your-coop.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: icn-gateway
            port:
              number: 8000
  - host: dashboard.your-coop.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: icn-dashboard
            port:
              number: 80
