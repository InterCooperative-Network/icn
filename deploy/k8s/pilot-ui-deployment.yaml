apiVersion: apps/v1
kind: Deployment
metadata:
  name: pilot-ui
  namespace: icn
  labels:
    app: icn
    component: pilot-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: icn
      component: pilot-ui
  template:
    metadata:
      labels:
        app: icn
        component: pilot-ui
    spec:
      containers:
      - name: pilot-ui
        image: icn-pilot-ui:latest
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      # Note: nginx:alpine needs root to create cache directories
      # For production, use a custom nginx image with proper permissions
---
apiVersion: v1
kind: Service
metadata:
  name: pilot-ui
  namespace: icn
  labels:
    app: icn
    component: pilot-ui
spec:
  type: ClusterIP
  selector:
    app: icn
    component: pilot-ui
  ports:
  - name: http
    port: 3000
    protocol: TCP
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: pilot-ui-nodeport
  namespace: icn
  labels:
    app: icn
    component: pilot-ui
spec:
  type: NodePort
  selector:
    app: icn
    component: pilot-ui
  ports:
  - name: http
    port: 3000
    protocol: TCP
    targetPort: http
    nodePort: 30030
