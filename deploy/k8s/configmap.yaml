apiVersion: v1
kind: ConfigMap
metadata:
  name: icn-config
  namespace: icn
  labels:
    app: icn
data:
  icn.toml: |
    data_dir = "/data"

    [network]
    listen_addr = "0.0.0.0:7777"
    rpc_port = 5601
    mdns_enabled = true
    bootstrap_peers = []
    stun_servers = []

    [observability]
    metrics_port = 9100
    health_port = 8080
    log_level = "info"

    [rate_limiting]
    enabled = true
    refill_interval_ms = 100

    [rate_limiting.isolated]
    max_messages_per_second = 10
    burst_capacity = 2

    [rate_limiting.known]
    max_messages_per_second = 50
    burst_capacity = 10

    [rate_limiting.partner]
    max_messages_per_second = 100
    burst_capacity = 20

    [rate_limiting.federated]
    max_messages_per_second = 200
    burst_capacity = 50

    [rate_limiting.fallback]
    max_messages_per_second = 100
    burst_capacity = 20

    [topology]
    region = "faherty-homelab"
    cluster_id = "k3s-icn"
    role = "edge"

    [topology.neighbor_limits]
    max_local_cluster = 10
    max_regional = 10
    max_backbone = 5
    max_trusted = 20

    [topology.fanout]
    local_cluster = 8
    regional = 6
    global = 4

