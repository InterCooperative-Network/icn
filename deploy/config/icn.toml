# ICN Configuration for Docker Deployment
# This config is used by the icnd container

data_dir = "/root/.icn"

[network]
# Enable local network discovery
mdns_enabled = true

# Listen on all interfaces
listen_addr = "0.0.0.0:7777"

# gRPC API port
rpc_port = 5601

# Bootstrap peers (add known peers here for distributed deployment)
bootstrap_peers = []

# For Docker/K8s deployments, consider setting min_trust_threshold to 0.0
# if all nodes in the deployment are pre-authorized and trusted
# Default: 0.1 (requires at least one trust relationship)
min_trust_threshold = 0.0

[observability]
# Prometheus metrics
metrics_port = 9100

# Health check port
health_port = 9091

# Log level
log_level = "info"

[gateway]
# Enable REST/WebSocket API
enabled = true

# Bind to all interfaces (nginx will proxy)
bind_addr = "0.0.0.0:8080"

# JWT secret from environment variable
# jwt_secret is set via ICN_GATEWAY_JWT_SECRET env var

# Token expiry
token_expiry_hours = 24

# Challenge TTL
challenge_ttl_minutes = 5

[rate_limiting]
enabled = true
refill_interval_ms = 100

[rate_limiting.isolated]
max_messages_per_second = 10
burst_capacity = 2

[rate_limiting.known]
max_messages_per_second = 50
burst_capacity = 10

[rate_limiting.partner]
max_messages_per_second = 100
burst_capacity = 20

[rate_limiting.federated]
max_messages_per_second = 200
burst_capacity = 50

# Identity backend configuration
# Selects which keystore backend to use for identity storage
[identity]
backend = "age"  # Options: "age" (default, software), "pkcs11" (HSM), "tpm" (TPM 2.0)

# PKCS#11 HSM backend configuration (only used when backend = "pkcs11")
# Note: PKCS#11 backend is scaffolding only and not yet functional
# [identity.pkcs11]
# library_path = "/usr/lib/softhsm/libsofthsm2.so"
# slot_id = 0
# key_label = "icn-identity"
# token_label = "softhsm"  # Optional

# TPM 2.0 backend configuration (only used when backend = "tpm")
# Note: TPM backend is scaffolding only and not yet functional
# [identity.tpm]
# device_path = "/dev/tpmrm0"
# key_handle = 0x81000000
# platform_binding = true
# attestation = false
