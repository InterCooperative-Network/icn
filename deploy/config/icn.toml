# ICN Configuration for Docker Deployment
# This config is used by the icnd container

data_dir = "/root/.icn"

[network]
# Enable local network discovery
mdns_enabled = true

# Listen on all interfaces
listen_addr = "0.0.0.0:7777"

# gRPC API port
rpc_port = 5601

# Bootstrap peers (add known peers here for distributed deployment)
bootstrap_peers = []

# For Docker/K8s deployments, consider setting min_trust_threshold to 0.0
# if all nodes in the deployment are pre-authorized and trusted
# Default: 0.1 (requires at least one trust relationship)
min_trust_threshold = 0.0

[observability]
# Prometheus metrics
metrics_port = 9100

# Health check port
health_port = 9091

# Log level
log_level = "info"

[gateway]
# Enable REST/WebSocket API
enabled = true

# Bind to all interfaces (nginx will proxy)
bind_addr = "0.0.0.0:8080"

# JWT secret from environment variable
# jwt_secret is set via ICN_GATEWAY_JWT_SECRET env var

# Token expiry
token_expiry_hours = 24

# Challenge TTL
challenge_ttl_minutes = 5

[rate_limiting]
enabled = true
refill_interval_ms = 100

[rate_limiting.isolated]
max_messages_per_second = 10
burst_capacity = 2

[rate_limiting.known]
max_messages_per_second = 50
burst_capacity = 10

[rate_limiting.partner]
max_messages_per_second = 100
burst_capacity = 20

[rate_limiting.federated]
max_messages_per_second = 200
burst_capacity = 50
