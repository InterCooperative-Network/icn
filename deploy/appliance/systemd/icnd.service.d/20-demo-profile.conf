# DEMO PROFILE ONLY — installed by build-image.sh when
# ICN_APPLIANCE_DEMO_PROFILE=1. Never installed on the base appliance
# image and never appropriate for production or partner deployments.
#
# What this changes, and why each change is demo-scoped:
#
# 1. Gateway bind 0.0.0.0:8080 (base unit binds 127.0.0.1:8080).
#    A stranger runs the image in QEMU with user-mode networking and a
#    hostfwd mapping; user-mode hostfwd targets the guest NIC address, so a
#    loopback-bound gateway is unreachable from the host browser. Inside the
#    user-net VM, 0.0.0.0 is still host-only exposure (no bridge, no LAN).
#    JWT auth stays enforced — firstboot's per-instance secret is unchanged.
#
# 2. ICN_ENABLE_ADMIN_ENDPOINTS + ICN_GOVERNANCE_BUILD_MODE=rehearsal.
#    The dev gate pair behind POST /v1/commons/dev/bootstrap-standing
#    (same pair the local devnet demo uses — see deploy/devnet and PR #2024).
#    Used by icn-demo-seed to make member standing visible in the shell and
#    to unlock the optional proposal/vote demo path.
#    `rehearsal` posture is a labeled non-production stance (like `test`,
#    permissive governance wiring) that ADDITIONALLY mounts the Rehearsal Node
#    organizer review→confirm surface (/v1/gov/domains/{d}/rehearsal/*, #2386).
#    The switch from `test` is strictly additive: the dev gates key on
#    "not production" (rehearsal passes), Production validation is unchanged
#    (validate() rejects only Production), and no runtime path keys on == "test".
#    Rehearsal is the EXACT-match opt-in; a typo falls back to Bootstrap, 404.
#
# 3. ICN_CORS_ORIGINS — the member-shell live mode runs in the operator's
#    browser on the host; its requests carry an Authorization header, which
#    forces a CORS preflight. The origins listed here are the hostfwd'd
#    shell URLs. Setting this also switches the gateway to its dev CORS
#    config (see crates/icn-gateway/src/security.rs).
#
# Deliberately absent: GATEWAY_BASE_URL.
#
# QR login and SDIS enrollment embed an origin that a SECOND device — a phone —
# posts its bearer credential to (#2569). This profile has no such origin to
# assert. The 0.0.0.0 bind in override 1 is host-only exposure behind QEMU
# user-mode hostfwd: nothing on the LAN can route to this guest, so there is no
# address a phone could be handed. The bind address is not an answer either —
# 0.0.0.0 names no reachable host.
#
# So QR issuance fails closed here: POST /v1/sessions and the SDIS enrollment
# start route return 503 and log the reason. That is the correct outcome for a
# host-only demo, not a regression. Everything the demo actually drives — the
# member shell, standing bootstrap, the proposal/vote path — is unaffected.
#
# The LAN rehearsal profile is the one that CAN issue QR material: it is reached
# over a bridged NIC through nginx, and its drop-in
# (deploy/appliance/lan/icnd-30-lan-origin.conf.in) sets GATEWAY_BASE_URL to the
# same operator-validated @LAN_ORIGIN@ its CORS allowlist uses.

[Service]
ExecStart=
ExecStart=/usr/local/bin/icnd \
    --data-dir /var/lib/icn \
    --gateway-enable \
    --gateway-bind 0.0.0.0:8080
Environment=ICN_ENABLE_ADMIN_ENDPOINTS=true
Environment=ICN_GOVERNANCE_BUILD_MODE=rehearsal
Environment=ICN_CORS_ORIGINS=http://localhost:8090,http://127.0.0.1:8090,http://localhost:18090,http://127.0.0.1:18090
