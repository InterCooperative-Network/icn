# Appliance-only drop-in for icnd.service.
#
# Installed into /etc/systemd/system/icnd.service.d/ on the appliance image
# by build-image.sh. Does NOT apply to native (non-appliance) installs of
# icnd.service, because the base unit in deploy/icnd.service does not load
# drop-ins outside the image.
#
# Why this exists: deploy/appliance/systemd/icn-appliance-firstboot.service
# uses `Before=icnd.service`, but `Before=` is ordering only — it does not
# stop icnd from starting if firstboot fails. Without this gate, a fresh
# VM whose firstboot oneshot fails (e.g. icnd binary missing, openssl
# missing, sudo blocked) would still start icnd, which would then run
# without the per-instance JWT, keystore passphrase, identity.age, or
# config.toml that firstboot is supposed to create.
#
# `Requires=` propagates failure: if firstboot fails, icnd is also marked
# failed instead of restart-looping on a half-provisioned state.
# `After=` enforces ordering (defense-in-depth alongside firstboot's
# own `Before=icnd.service`).
# `ConditionPathExists=` is an extra belt: if the marker file is somehow
# missing despite firstboot reporting success, icnd is skipped (with the
# "condition failed" disposition) rather than started.

[Unit]
After=icn-appliance-firstboot.service
Requires=icn-appliance-firstboot.service
ConditionPathExists=/var/lib/icn/.firstboot-complete
