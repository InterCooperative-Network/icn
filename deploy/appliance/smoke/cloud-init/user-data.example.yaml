#cloud-config
# ICN appliance smoke — cloud-init user-data EXAMPLE
#
# Smoke / dev only. Not production.
#
# WHAT THIS FILE IS:
#   A minimal cloud-init seed that gives the local-dev QCOW2 image enough
#   to boot, accept SSH from the operator's test key, and reach a usable
#   state for smoke verification.
#
# WHAT THIS FILE IS NOT:
#   - Not signed.
#   - Not for production VMs.
#   - Not for hosts reachable from any real network.
#   - Not authoritative; it does not bind identity to the appliance.
#
# HOW TO USE LOCALLY:
#   1. Copy this file to a working location:
#        cp deploy/appliance/smoke/cloud-init/user-data.example.yaml /tmp/user-data
#   2. Replace the placeholder SSH key with YOUR local test key
#      (a key dedicated to disposable smoke VMs, NOT your daily key):
#        echo "ssh-ed25519 AAAA...test-only..." >> /tmp/user-data
#      (or edit /tmp/user-data and paste under ssh_authorized_keys).
#   3. Build a seed ISO using cloud-localds (cloud-image-utils package):
#        cloud-localds /tmp/seed.iso /tmp/user-data deploy/appliance/smoke/cloud-init/meta-data.example.yaml
#   4. Pass that seed ISO and the appliance image to smoke-local.sh.
#
# REMINDER: The appliance image itself contains NO secrets and NO SSH
# keys. SSH access is granted only via the operator-supplied cloud-init
# seed, per-VM, never committed.

# Set a recognizable smoke hostname so journalctl logs are easy to spot.
hostname: icn-appliance-smoke
manage_etc_hosts: true

# Default user for the Debian genericcloud image is `debian`. We add the
# operator's smoke SSH key to that user's authorized_keys and grant
# password-less sudo so the smoke script can poke at systemd / journal.
users:
  - name: debian
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: [sudo]
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      # REPLACE THIS LINE with your local smoke-only test SSH public key.
      # Do NOT commit a real key. Leave this comment in place so reviewers
      # can see the placeholder pattern.
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5INVALIDREPLACEMETHISISAPLACEHOLDER smoke-test-placeholder"

# Disable cloud-init's password auth path; SSH keys only.
ssh_pwauth: false
disable_root: true

# Smoke run packages — keep this minimal. The appliance image already
# installs ca-certificates, curl, etc. via virt-customize.
packages: []

# Boot-time commands.
#   - Nudge the firstboot unit to log that cloud-init handed off cleanly.
#   - Do NOT pre-create /var/lib/icn/.firstboot-complete; the appliance's
#     firstboot service must run.
runcmd:
  - [ sh, -c, "logger -t icn-appliance-smoke 'cloud-init runcmd: handed off to icn-appliance-firstboot.service'" ]

# Honest final-message banner.
final_message: |
  ICN appliance smoke VM booted via cloud-init.
  This VM is non-production. The appliance image is unsigned.
  Per-instance JWT and keystore passphrase were generated by
  icn-appliance-firstboot.service on first boot, NOT embedded in the image.
