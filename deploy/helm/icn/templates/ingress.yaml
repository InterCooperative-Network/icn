{{- if .Values.icn.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "icn.fullname" . }}
  labels:
    {{- include "icn.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.icn.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.icn.ingress.className }}
  tls:
  - hosts:
    - {{ .Values.icn.ingress.host }}
    secretName: {{ include "icn.fullname" . }}-tls
  rules:
  - host: {{ .Values.icn.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "icn.fullname" . }}-gateway
            port:
              number: {{ .Values.icn.service.gateway.port }}
{{- end }}
