    privacy_risk: medium
    boundary_risk: medium
    risks:
      - "Easy to invent ICN core primitives prematurely; keep in NYCN until the slice produces real signal."
      - "Privacy: real organizer/sponsor identities stay in private overlay."
    next_transform: |
