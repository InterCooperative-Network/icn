# ICN ADR Candidate Registry
#
# A planning index of every ADR ICN intends to write — both back-fills of
# existing implementation reality and forward-state direction.
#
# This file is NOT a decision record. Decisions live in docs/adr/.
# Rows here exist so the long arc of architecture does not get designed
# out by accident between sessions.
#
# Conventions: see ops/coordination/README.md
# ADR lifecycle: see docs/adr/ADR-0018-adr-lifecycle-and-canonical-decision-index.md
# Numbering: continues from the highest existing ADR (0020 at registry-creation time)
# Updated: 2026-04-26
#
# Field reference:
#   id: ADR number (zero-padded, 4 digits)
#   title: Short decision title
#   proposed_status: status the ADR will carry once written (proposed | accepted)
#   registry_state: candidate | drafted | merged
#   adr_path: path to the file (set when registry_state >= drafted)
#   domain: ccl | governance | federation | economics | compute | member-shell | accessibility | conflict | package | website | project-governance | provenance
#   why_it_matters: 1-2 sentence rationale
#   icn_runtime_surface: what kernel/runtime surface this affects, or "doctrinal" for pure design
#   package_or_institution_expression: how institution packages express this
#   accessibility_implications: how this lands for low-bandwidth/low-device/non-English/disabled members
#   conflict_or_dispute_path: how disputes about this surface are handled
#   compute_or_automation_boundary: what compute can and cannot do here
#   website_truth_implication: what the public site can claim once this ADR is accepted and implemented
#   existing_issues: GitHub issue references that already exist
#   missing_issues: issues that should be opened to drive this work
#   depends_on: ADR ids that must land first
#   priority: now | soon | later
#   tranche: 1 | 2 | 3 | 4

candidates:

  # ─────────────────────────────────────────────────────────────────────
  # TRANCHE 1 — drafted in this PR
  # Foundational ADRs without which later ADRs cannot stably reference
  # shared concepts. Mix of back-fills (accepted, evidence-linked) and
  # forward direction (proposed, named-but-not-decided).
  # ─────────────────────────────────────────────────────────────────────

  - id: "0021"
    title: "CCL Determinism, Fuel, and Capability Safety"
    proposed_status: accepted
    registry_state: drafted
    adr_path: "docs/adr/ADR-0021-ccl-determinism-fuel-and-capability-safety.md"
    domain: ccl
    why_it_matters: "CCL's safety properties (deterministic, fuel-metered, not Turing-complete, capability-bounded) are the precondition for trusting CCL output as governance-grade input. They have been implemented for some time without a written decision."
    icn_runtime_surface: "icn-ccl interpreter; LocalExecutor and WasmExecutor in icn-compute; schema bridge in icn-ccl/src/schema/bridge.rs"
    package_or_institution_expression: "Packages author CCL contracts and schema-bound charters; safety properties apply to both."
    accessibility_implications: "Determinism gives every member the same answer regardless of node, which is the precondition for accessibility at the result layer."
    conflict_or_dispute_path: "Disputes over CCL outputs re-execute the contract under the same fuel/capability bounds; divergence is detectable."
    compute_or_automation_boundary: "CCL is the only sanctioned execution surface for governance-grade computation; non-deterministic or Turing-complete code is rejected."
    website_truth_implication: "Site may say CCL is deterministic, fuel-metered, and capability-bounded — and link to this ADR for the formal claim."
    existing_issues: []
    missing_issues: []
    depends_on: []
    priority: now
    tranche: 1

  - id: "0022"
    title: "CCL Schema Bridge and Constraint Compilation"
    proposed_status: accepted
    registry_state: drafted
    adr_path: "docs/adr/ADR-0022-ccl-schema-bridge-and-constraint-compilation.md"
    domain: ccl
    why_it_matters: "The schema bridge is where institutional design (charters) becomes kernel-enforceable constraints. This is the meaning firewall for CCL-driven policy."
    icn_runtime_surface: "icn-ccl/src/schema/{mod,bridge,governance,economics,agreement}.rs; ConstraintSet output to icn-kernel-api"
    package_or_institution_expression: "Packages ship YAML charters with thresholds, weights, formulas; the bridge compiles these into ConstraintSet at proposal acceptance time."
    accessibility_implications: "Plain-language schemas make charter authoring legible to non-engineers."
    conflict_or_dispute_path: "Disputes over compiled constraints re-run the bridge; divergence indicates either schema bug or charter ambiguity."
    compute_or_automation_boundary: "Compute receives compiled ConstraintSet only. Compute cannot read raw charter semantics."
    website_truth_implication: "Site may explain how a charter becomes enforced policy without overclaiming that CCL runs full institutional workflows."
    existing_issues: []
    missing_issues: []
    depends_on: ["0021"]
    priority: now
    tranche: 1

  - id: "0023"
    title: "CCL Institutional Process Language"
    proposed_status: proposed
    registry_state: drafted
    adr_path: "docs/adr/ADR-0023-ccl-institutional-process-language.md"
    domain: ccl
    why_it_matters: "CCL today encodes thresholds and formulas. The forward direction is CCL as the language for institutional processes — workflows, deadlines, escalations, conflict resolution steps. Naming this direction now lets later ADRs depend on it."
    icn_runtime_surface: "Future: process-runner inside icn-governance or a new icn-process crate; schema additions in icn-ccl"
    package_or_institution_expression: "Packages ship process definitions (e.g., onboarding, grievance, allocation review) as CCL alongside charter rules."
    accessibility_implications: "Process steps must be expressible in plain language and renderable as action cards; deadline semantics must accommodate caregiving and time-justice constraints."
    conflict_or_dispute_path: "Process definitions themselves can be amended via governance; in-flight processes get appeal/escalation rules from the same CCL surface."
    compute_or_automation_boundary: "Compute executes process steps that are deterministic and bounded; human judgment steps pause for member input."
    website_truth_implication: "Site can describe CCL as the rule/process language direction (charter constraints already prove the pattern) without claiming process runtime exists."
    existing_issues: ["#863"]
    missing_issues: ["scope: process step grammar", "scope: deadline semantics", "scope: escalation rules"]
    depends_on: ["0021", "0022"]
    priority: soon
    tranche: 1

