    accessibility_implications: "Effects expose plain-language summaries readable by holders; records are queryable from /me/standing."
    conflict_or_dispute_path: "Effect records are addressable for appeal/reversal; reversal produces a counter-effect, not a deletion."
    compute_or_automation_boundary: "Compute may produce effect records under mandate; cannot produce effects without a covering authority grant."
    website_truth_implication: "Site can describe ICN's institutional memory once effect records have a canonical schema and dispatch consults mandates (today, kernel does not gate on mandates)."
    existing_issues: ["#1607"]
