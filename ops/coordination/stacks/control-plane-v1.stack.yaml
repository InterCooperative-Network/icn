# control-plane-v1.stack.yaml — stack manifest for the ecosystem control-plane PR stack.
#
# Coordination metadata ONLY. This file records cross-repo merge order and
# stack state (format: icn-pr-stack/v1 — see ops/coordination/PR_STACK_PROTOCOL.md;
# validate with scripts/check-pr-stack.sh). It is not architectural truth
# (ops/state/truth/sources.json is the arbiter), not runtime truth, and no
# readiness claim of any kind may be inferred from anything recorded here.
#
# Parsing contract: scalar keys are `key: value` on one line; list values use
# flow style on one line (e.g. `merged_prs: [2354, 2356]`). Keep it that way —
# the checker is deliberately line-oriented.

schema: icn-pr-stack/v1
stack_id: control-plane-v1
anchor_issue: InterCooperative-Network/icn#2141
description: >-
  Ecosystem control plane: preflight/root hardening, org-repo coordination
  registry + truth-spine validator, reusable claim firewall, stack protocol
  + manifests, then downstream locks, status envelopes, caller workflows,
  and a dashboard home. Coordination metadata for the stack itself.

non_claims:
  - not-runtime
  - not-production
  - not-pilot
  - not-live-federation
  - downstream-caller-and-envelope-adoption-is-not-a-runtime-pilot-readiness-or-live-federation-claim
  - adopted-means-lock-envelope-and-warning-mode-caller-on-default-branch-only-not-runtime-integration
  - downstream-locks-carry-reviewer-pending-and-are-not-human-signed

dependency_policy:
  - "A stage may be marked merged or adopted only after every stage it depends on is merged or adopted."
  - "Downstream repos must not claim claim-lint adoption until a caller workflow lands on their default branch (per-repo caller status lives in each stage entry below and in repo-map.json#org_repos — nycn (nycn#81), icn-learn (icn-learn#4), and icn-community-bridge (icn-community-bridge#2) callers have landed; icn-infra has none)."
  - "Upstream lock refreshes must cite the exact icn merge commit they were reviewed against."

stages:
  - stage: 1
    repo: InterCooperative-Network/icn
    status: merged
    depends_on_stages: []
    merged_prs: [2354, 2356, 2358, 2359]
    note: "Preflight/root hardening (also Refs icn#2140), org-repo registry + truth-spine validator, config-driven claim linter + reusable workflow, and the stack protocol + this manifest (#2359, merge 36f5b08c) — all merged to icn main. The in-flight manifest PR that kept this stage at 'implemented' has landed, so the stage is now 'merged' (the downstream-consumed surfaces — reusable claim-lint workflow and the reviewed pin — are on main). Optional advisory-routing work (plan PR9) is not a committed rung of this stack."

  - stage: 2
    repo: InterCooperative-Network/icn-infra
    status: planned
    depends_on_stages: [1, 3, 4, 5]
    merged_prs: []
    note: "Ecosystem dashboard home. Consumes downstream status envelopes, so in THIS stack it intentionally depends on stages 3-5 despite its lower stage number."

  - stage: 3
    repo: InterCooperative-Network/nycn
    status: adopted
    depends_on_stages: [1]
    merged_prs: [80, 81]
    note: "Both adoption conditions are met on nycn main: the upstream lock cites the reviewed icn ref (PR #80 `chore(sync): refresh icn upstream lock`, pin 91a63eec->36f5b08c, merge 9d7982fd) AND a claim-lint caller workflow is on the default branch (PR #81 `chore(ci): add nycn status envelope and claim-lint caller`, merge 7dfda45c; caller pinned to icn 36f5b08c in both uses: and icn-ref). 'adopted' is a coordination fact about the caller/envelope existing — it is NOT a runtime, pilot, readiness, live-federation, or production claim, and NYCN's lock still carries human_review: pending."

  - stage: 4
    repo: InterCooperative-Network/icn-learn
    status: adopted
    depends_on_stages: [1]
    merged_prs: [4]
    note: "Adopted on icn-learn main: first ICN upstream lock (reviewer: pending, no reviewed_at — machine-prepared, NOT human-signed), status envelope, and a claim-lint caller pinned to icn d944cf04 (both uses: and icn-ref) on the default branch (PR #4 `chore(ops): add icn-learn control-plane envelope and claim lint`, merge 6a61f927). No heavy checked-against policy: icn-learn deliberately links to ICN main, so its lock is the repo-level reviewed-against anchor (a CANONICAL_LINKING bullet points at it). 'adopted' = the caller/envelope existing on the default branch; it is NOT a runtime, pilot, readiness, or live-federation claim, and icn-learn consumes no ICN runtime contract."

  - stage: 5
    repo: InterCooperative-Network/icn-community-bridge
    status: adopted
    depends_on_stages: [1]
    merged_prs: [2]
    note: "Adopted on icn-community-bridge main: first ICN upstream lock (reviewer: pending, no reviewed_at — machine-prepared, NOT human-signed), status envelope, and a claim-lint caller pinned to icn d944cf04 (both uses: and icn-ref) on the default branch (PR #2 `chore(ops): add bridge control-plane envelope and claim lint`, merge 4592e869). The bridge remains scaffold/planned, not built, with no ICN runtime consumption and no governance/identity authority. 'adopted' = the caller/envelope existing on the default branch; it is NOT a runtime, pilot, readiness, live-federation, deployment, or production claim."

  - stage: 6
    repo: InterCooperative-Network/.github
    status: none
    depends_on_stages: []
    merged_prs: []
    note: "No work planned in this stack: org profile verified clean 2026-07-07. Mirror updates land last, only after public truth lands in icn."
